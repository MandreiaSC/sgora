<!doctype html>
<html lang="pt-BR">
<head>
<!-- SGO_RA — Sistema de Gestão em Osteopatia. © 2026 Marcia Sales. Todos os direitos reservados (Lei 9.609/1998). -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f4c46">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SGO_RA">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icone_180.png">
<title>SGO_RA</title>
<style>
  :root{
    --verde:#0f4c46; --verde-escuro:#0b3733; --verde-medio:#1d7a6d; --verde-claro:#2f9e8f; --menta:#cdeae3; --menta-claro:#eaf6f3;
    --fundo:#f4f8f7; --borda:#d3e8e3; --texto:#1c2b29; --texto-sec:#5c7570; --texto-ter:#8a9c98; --sombra:0 2px 10px rgba(15,76,70,0.12);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; background:var(--fundo); color:var(--texto); font-family:'Segoe UI', -apple-system, Roboto, sans-serif; touch-action:manipulation;}
  body{min-height:100vh;}
  button{font-family:inherit;}
  a{color:var(--verde-medio);}
  .topo{background:var(--verde); color:#f2fbf9; padding:calc(env(safe-area-inset-top) + 16px) 14px 12px 4px; display:flex; align-items:center; gap:4px; position:sticky; top:0; z-index:5;}
  .topo .voltar{width:44px; height:44px; display:flex; align-items:center; justify-content:center; color:#f2fbf9; background:none; border:0;}
  .topo .titulo{flex:1; font-size:20px; font-weight:600; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .marca-topo{display:flex; flex-direction:column; align-items:center; gap:2px; flex:none;}
  .marca-topo img{width:34px; height:38px; object-fit:contain;}
  .marca-topo span{font-size:8.5px; font-weight:600; letter-spacing:.6px; color:#f2fbf9;}
  .marca-topo.grande img{width:46px; height:52px;}
  .marca-topo.grande span{font-size:9.5px;}
  .conteudo{padding:16px; display:flex; flex-direction:column; gap:14px; padding-bottom:calc(env(safe-area-inset-bottom) + 24px);}
  .cartao{background:#fff; border-radius:10px; box-shadow:var(--sombra);}
  .btn{min-height:48px; display:flex; align-items:center; justify-content:center; gap:8px; border-radius:10px; background:var(--verde); color:#fff; font-size:16px; font-weight:600; border:0; padding:0 16px; width:100%; cursor:pointer;}
  .btn.claro{background:#fff; color:var(--verde); border:1px solid var(--borda);}
  .btn.medio{background:var(--verde-claro);}
  .btn:disabled{opacity:.55;}
  .link{background:none; border:0; color:var(--texto-sec); font-size:15px; text-decoration:underline; min-height:40px; align-self:center; cursor:pointer;}
  .campo{display:flex; flex-direction:column; gap:6px; font-size:15px; font-weight:600; color:var(--texto-sec);}
  .campo input, .campo select{height:48px; border:1px solid var(--borda); border-radius:10px; padding:0 14px; font-size:17px; font-family:inherit; color:var(--texto); background:#fff; width:100%;}
  .aviso{font-size:14px; padding:10px 12px; border-radius:8px; background:var(--menta-claro); color:var(--verde-escuro); margin:0;}
  .aviso.erro{background:#fdf1f0; color:#a33025;}
  .vazio{text-align:center; color:var(--texto-ter); font-size:14px; padding:18px 8px;}
  .etiqueta{font-size:12px; font-weight:700; border-radius:999px; padding:3px 9px; white-space:nowrap;}
  /* entrada */
  .tela-entrada{min-height:100vh; background:var(--verde); display:flex; flex-direction:column; align-items:center; padding:calc(env(safe-area-inset-top) + 60px) 22px 30px;}
  .tela-entrada > img{width:70px; height:80px; object-fit:contain;}
  .tela-entrada .marca{margin:10px 0 26px; font-size:16px; font-weight:600; letter-spacing:1px; color:#f2fbf9;}
  .quadro-entrada{width:100%; max-width:420px; background:#fff; border-radius:14px; padding:26px 22px 20px; box-shadow:var(--sombra); display:flex; flex-direction:column; gap:14px;}
  .quadro-entrada h1{margin:0; font-size:22px; font-weight:700; color:var(--verde-escuro); text-align:center;}
  .quadro-entrada .sub{margin:2px 0 0; font-size:13px; font-weight:600; color:var(--texto-ter); text-align:center;}
  .rodape-entrada{margin:auto 0 0; padding-top:20px; font-size:13px; color:var(--menta); text-align:center;}
  .senha{position:relative; display:block;}
  .senha input{padding-right:48px;}
  .senha button{position:absolute; right:2px; top:2px; width:44px; height:44px; border:0; background:transparent; display:flex; align-items:center; justify-content:center;}
  .passos{display:flex; gap:6px; justify-content:center;}
  .passos span{width:28px; height:6px; border-radius:3px; background:var(--borda);}
  .passos span.feito{background:var(--verde-claro);}
  .barra{height:8px; border-radius:4px; background:var(--borda); overflow:hidden;} .barra div{height:100%; background:var(--verde-claro); width:0; transition:width .2s;}
  /* hoje */
  /* Hoje: ocupa exatamente a tela. A Agenda do dia cresce no espaço livre; com muitos agendamentos, rola por dentro
     e os botões ficam sempre à vista embaixo. Em tela muito baixa, a página toda rola. */
  .tela-hoje{height:100vh; height:100dvh; display:flex; flex-direction:column;}
  .tela-hoje .conteudo{flex:1; min-height:0; overflow-y:auto;}
  .tela-hoje .agenda-dia{flex:1 1 auto; min-height:170px; display:flex; flex-direction:column; overflow:hidden;}
  .lista-ag{flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;}
  .lista-ag .vazio{padding:28px 8px;}
  .cabeca-hoje{background:var(--verde); color:#f2fbf9; padding:calc(env(safe-area-inset-top) + 22px) 16px 18px; display:flex; align-items:center; gap:14px;}
  .avatar{width:52px; height:52px; border-radius:50%; border:2px solid var(--menta); background:var(--menta); color:var(--verde); font-weight:700; display:flex; align-items:center; justify-content:center; flex:none; overflow:hidden;}
  .avatar img{width:100%; height:100%; object-fit:cover;}
  .agenda-dia .faixa{background:var(--verde-claro); color:#fff; display:flex; align-items:center; gap:8px; padding:12px 14px; border-radius:10px 10px 0 0;}
  .agenda-dia .faixa b{flex:1; font-size:17px;}
  .contador{font-size:13px; font-weight:700; background:rgba(255,255,255,0.25); border-radius:999px; padding:2px 9px;}
  .linha-ag{display:flex; align-items:center; gap:12px; padding:13px 14px; font-size:16px; border-bottom:1px solid var(--borda); color:var(--texto); text-decoration:none; background:none; border-left:0; border-right:0; border-top:0; width:100%; text-align:left; font:inherit;}
  .linha-ag:last-child{border-bottom:0;}
  .linha-ag .hora{width:50px; font-size:16px; font-weight:700; color:var(--verde-medio);}
  .linha-ag .nome{flex:1; font-size:16px; min-width:0;}
  .dupla{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:12px;}
  .mini{border-radius:10px; padding:13px 14px; box-shadow:var(--sombra); min-width:0; min-height:96px;}
  .mini p{margin:0 0 6px; display:flex; align-items:center; gap:6px; font-size:15px; font-weight:700;}
  .mini ul{margin:0; padding-left:16px; font-size:14px; line-height:1.5;}
  .mini.lembretes{background:#fdf1f0; border-left:4px solid #c0392b;} .mini.lembretes p{color:#a33025;}
  .mini.aniversario{background:#fffbea; border-left:4px solid #e0a030;} .mini.aniversario p{color:#8a5a00;}
  .botoes-menu{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:12px; margin-top:auto; padding-top:4px;}
  .bt{min-height:88px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; border-radius:12px; background:var(--verde); color:#f2fbf9; font-size:16px; font-weight:600; border:0; box-shadow:var(--sombra); cursor:pointer;}
  .bt svg{width:28px; height:28px;}
  .bt.sair{grid-column:1 / -1; min-height:54px; flex-direction:row; background:#fff; color:var(--verde); border:1px solid var(--borda);}
  .bt.sair svg{width:24px; height:24px;}
  .situacao-sinc{margin:2px 0 0; min-height:36px; display:flex; align-items:center; justify-content:center; gap:6px; font-size:13px; color:var(--texto-sec); background:none; border:0; width:100%;}
  /* pacientes */
  .cab-lista{display:flex; justify-content:space-between; align-items:center; gap:8px;}
  .cab-lista b{font-size:15px; color:var(--verde-escuro);}
  .seg{display:flex; background:#fff; border:1px solid var(--borda); border-radius:10px; padding:3px; gap:3px;}
  .seg button{flex:1; min-height:38px; border:0; border-radius:8px; background:none; font-size:15px; font-weight:600; color:var(--texto-sec);}
  .seg button.ativo{background:var(--verde); color:#fff;}
  .ordem{background:none; border:0; font-size:13px; color:var(--texto-sec); min-height:36px;}
  .item-pac{display:flex; align-items:center; gap:10px; padding:10px 6px 10px 14px;}
  .item-pac button.abrir{flex:1; text-align:left; background:none; border:0; padding:0; color:var(--texto); font:inherit; min-width:0;}
  .item-pac .n{display:block; font-size:16px; font-weight:600;}
  .item-pac .d{display:block; font-size:13px; color:var(--texto-sec); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .olho{width:44px; height:44px; border:0; background:transparent; display:flex; align-items:center; justify-content:center; flex:none;}
  /* ficha */
  .faixa-pac{background:var(--menta-claro); border-bottom:1px solid var(--borda); padding:12px 16px;}
  .faixa-pac p{margin:0; font-size:15px; color:var(--verde-escuro);}
  .faixa-pac p + p{margin-top:2px;}
  .submenus{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:8px;}
  .sm{min-height:52px; display:flex; align-items:center; padding:0 14px; border-radius:10px; background:#e3f2ef; color:#3d5a55; font-size:16px; font-weight:600; border:0; text-align:left;}
  .sm.largo{grid-column:span 2; background:var(--menta); color:var(--verde);}
  .sm.breve{opacity:.55;}
  .dados{display:flex; flex-direction:column;}
  .dados .l{display:flex; justify-content:space-between; gap:12px; padding:10px 14px; border-bottom:1px solid var(--borda); font-size:15px;}
  .dados .l:last-child{border-bottom:0;}
  .dados .l span:first-child{color:var(--texto-sec); flex:none;}
  .dados .l span:last-child{text-align:right; font-weight:600; overflow-wrap:anywhere;}
  .grupo{font-size:13px; font-weight:700; color:var(--verde-medio); margin:6px 2px -4px;}
  .consulta{padding:12px 14px; display:flex; flex-direction:column; gap:4px;}
  .consulta .t{display:flex; justify-content:space-between; align-items:center;}
  .consulta .t b{font-size:15px; color:var(--verde-escuro);}
  .consulta .x{font-size:14px; color:var(--texto); white-space:pre-wrap; overflow-wrap:anywhere;}
  .consulta .x i{font-style:normal; color:var(--texto-sec); font-weight:600;}
  .ordem-data{align-self:flex-end;}
  /* folha de baixo (olhinho) */
  .veu{position:fixed; inset:0; background:rgba(11,55,51,.45); z-index:20; display:flex; align-items:flex-end;}
  .folha{background:#fff; width:100%; max-height:88vh; overflow:auto; border-radius:16px 16px 0 0; padding:16px 16px calc(env(safe-area-inset-bottom) + 18px);}
  .folha h2{margin:0 0 10px; font-size:18px; color:var(--verde-escuro);}
  .bloco-abrir summary{list-style:none; display:flex; flex-direction:column; gap:3px; padding:13px 40px 13px 14px; position:relative; cursor:pointer;}
  .bloco-abrir summary::-webkit-details-marker{display:none;}
  .bloco-abrir summary::after{content:''; position:absolute; right:16px; top:50%; width:9px; height:9px; border-right:2px solid var(--verde-medio); border-bottom:2px solid var(--verde-medio); transform:translateY(-70%) rotate(45deg); transition:transform .15s;}
  .bloco-abrir[open] summary::after{transform:translateY(-30%) rotate(-135deg);}
  .bloco-abrir .ba-t{font-size:16px; font-weight:700; color:var(--verde-escuro);}
  .bloco-abrir .ba-r{font-size:13px; color:var(--texto-sec); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .bloco-abrir[open] .ba-r{display:none;}
  .bloco-abrir .dados{border-top:1px solid var(--borda);}
  .obs{font-size:13px; font-style:italic; color:var(--texto-ter); font-weight:400 !important;}
  .rot-tab{margin:12px 14px 6px; font-size:14px; font-weight:700; color:var(--verde-medio);}
  .tab-neural{width:calc(100% - 28px); margin:0 14px 12px; border-collapse:collapse; font-size:14px; table-layout:fixed;}
  .tab-neural th, .tab-neural td{border:1px solid var(--borda); text-align:center; height:36px; padding:0 2px;}
  .tab-neural th{background:var(--menta-claro); color:var(--verde-escuro); font-weight:700;}
  .tab-neural th:first-child{background:none; border:0; width:34%;}
  .tab-neural td.rot{text-align:left; padding-left:8px; color:var(--texto-sec); font-size:13px;}
  .cadeia-figs{display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:12px 14px 4px;}
  .fig{display:flex; flex-direction:column; align-items:center; gap:4px; background:none; border:0; padding:0; font:inherit; color:var(--verde-escuro); font-size:13px; font-weight:700;}
  .fig svg{width:100%; height:auto; display:block;}
  .fig.desenho{grid-column:1 / -1;}
  .img-desenho{width:100%; max-width:320px; aspect-ratio:1; background:#fff; border:1px solid var(--borda); border-radius:10px; display:block; margin:0 auto;}
  .sem-desenho{display:block; padding:18px; color:var(--texto-ter); font-weight:400; font-size:13px;}
  .dica-ampliar{margin:0 14px 6px; font-size:12px; color:var(--texto-ter); text-align:center;}
  .veu-cheio{align-items:stretch;}
  .folha-cheia{max-height:100vh; height:100%; border-radius:0; padding-top:calc(env(safe-area-inset-top) + 14px);}
  .ampliado svg, .ampliado .img-desenho{width:100%; max-width:none; height:auto;}
  .campo-filtro{font-size:14px;}
  .campo-filtro input, .campo-filtro select{height:46px; font-size:16px;}
  .dia-ag{padding:10px 14px; font-size:15px; font-weight:700; color:var(--verde-escuro); background:var(--menta-claro); border-radius:10px 10px 0 0; border-bottom:1px solid var(--borda);}
  .dia-ag span{font-weight:400; color:var(--texto-sec); font-size:13px;}
  .linha-ag .det{display:block; font-size:12px; color:var(--texto-sec);}
  .linha-ag .data-ag{width:88px; font-size:15px; font-weight:700; color:var(--verde-medio); display:flex; flex-direction:column;}
  .linha-ag .data-ag small{font-weight:400; color:var(--texto-sec); font-size:12px;}
  .avulso{font-size:12px; color:#8a5a00;}
  #lista-fin .item-pac, .cartao > .item-pac{border-bottom:1px solid var(--borda);}
  #lista-fin .item-pac:last-child, .cartao > .item-pac:last-child{border-bottom:0;}
  /* documento avulso: folha do tamanho real (A4), encolhida para caber; amplia com dois dedos ou − / + */
  .folha-doc{display:flex; flex-direction:column; height:100%;}
  .folha-doc h2{margin-bottom:8px;}
  .zoom-doc{display:flex; justify-content:flex-end; align-items:center; gap:8px; margin:0 0 8px;}
  .zoom-doc button{width:44px; height:38px; border:1.5px solid var(--borda); border-radius:10px; background:#fff; color:var(--verde); font-size:21px; font-weight:600; font-family:inherit;}
  .zoom-doc span{min-width:50px; text-align:center; font-size:14px; color:var(--texto-sec);}
  .visor-doc{flex:1 1 auto; min-height:0; overflow:auto; -webkit-overflow-scrolling:touch; touch-action:pan-x pan-y; border-radius:10px; background:#6f7f7b;}
  .visor-escala{position:relative; overflow:hidden;}
  .visor-escala iframe{position:absolute; left:0; top:0; border:0; transform-origin:0 0; pointer-events:none; background:#6f7f7b;}
  .totais{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:8px;}
  .totais div{background:#fff; border-radius:10px; box-shadow:var(--sombra); padding:10px 12px; font-size:13px; color:var(--texto-sec);}
  .totais b{display:block; font-size:17px; color:var(--verde-escuro);}
  .form-cartao{padding:14px; display:flex; flex-direction:column; gap:12px;}
  .campo-form{font-size:14px;}
  .campo-form input, .campo-form select{height:48px; font-size:16px;}
  .principal{color:var(--verde-claro); font-weight:900;}
  .idade-form{margin:-4px 2px 0; font-size:14px; color:var(--texto-sec);}
  .legenda-principal{margin:0 2px; font-size:13px; color:var(--texto-sec);}
  .seg-bio{min-width:104px; min-height:38px; border-radius:999px; border:1px solid var(--borda); background:#eef2f1; color:var(--texto-sec); font-size:14px; font-weight:700; flex:none;}
  .seg-bio.ligado{background:var(--verde-claro); border-color:var(--verde-claro); color:#fff;}
  .campo textarea{border:1px solid var(--borda); border-radius:10px; padding:10px 14px; font-size:16px; font-family:inherit; color:var(--texto); background:#fff; width:100%; min-height:96px; resize:vertical;}
  .marcar{display:flex; align-items:center; gap:10px; font-size:15px; font-weight:600; color:var(--texto-sec); min-height:40px;}
  .marcar input{width:22px; height:22px; flex:none; accent-color:var(--verde-claro);}
  .pac-fixo{margin:0; font-size:16px; font-weight:700; color:var(--verde-escuro);}
  .btn.perigo{background:#c0392b;}
  .btn.pequeno{min-height:40px; font-size:14px; width:auto; padding:0 14px;}
  button.mini{text-align:left; border:0; font:inherit; width:100%; cursor:pointer;}
  .linha-lemb{display:flex; align-items:center; gap:10px; padding:10px 12px; border-bottom:1px solid var(--borda);}
  .linha-lemb:last-child{border-bottom:0;}
  .linha-lemb input[type=checkbox]{width:24px; height:24px; flex:none; accent-color:var(--verde-claro);}
  .linha-lemb .tx{flex:1; min-width:0; font-size:15px; overflow-wrap:anywhere;}
  .linha-lemb .tx small{display:block; font-size:12px; color:var(--texto-sec); font-weight:600;}
  .linha-lemb.feito .tx{text-decoration:line-through; color:#9db3ae;}
  .sugestoes{display:flex; flex-direction:column; border-radius:10px; overflow:hidden;}
  .sugestoes:not(:empty){border:1px solid var(--borda);}
  .sugestoes button{text-align:left; background:#fff; border:0; border-bottom:1px solid var(--borda); padding:10px 12px; font:inherit; font-size:15px; color:var(--texto); display:flex; flex-direction:column; gap:2px;}
  .sugestoes button:last-child{border-bottom:0;}
  .sugestoes button span{font-size:12.5px; color:var(--texto-sec); font-weight:400;}
  .visor-img{background:#1c2b29;}
  .visor-img img{display:block; max-width:none; height:auto; margin:auto;}
  .marca-arq{width:24px; height:24px; margin:0 10px; flex:none; accent-color:var(--verde-claro);}
  .fase-faixa{font-weight:700; color:var(--verde-medio) !important;}
  .acoes-ficha .btn{font-size:14px; padding:0 8px; line-height:1.2;}
  .alta-hist{background:#fbfdfc; border:1px solid var(--borda); border-radius:10px; padding:10px 12px;}
  .alta-hist .t{margin:0 0 6px; font-size:12px; font-weight:700; color:var(--texto-ter); text-transform:none;}
  .alta-hist p{margin:4px 0; font-size:13px; color:var(--texto-sec);}
  .alta-hist p b{color:var(--verde-escuro);}
  .alta-hist .m{display:block; font-size:12.5px; color:var(--texto-sec);}
  .botoes-arq{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px;}
  .botoes-arq .btn{flex-direction:column; gap:4px; min-height:66px; font-size:14px; padding:0 6px;}
  .cel-neural{width:100%; height:34px; border:0; background:transparent; text-align:center; font-size:16px; font-family:inherit; color:var(--texto); padding:0;}
  .cel-neural:focus{outline:2px solid var(--verde-claro); background:#fff;}
  .canvas-cel{width:100%; max-width:420px; aspect-ratio:1; display:block; margin:0 auto; background:#fff; border:1px solid var(--borda); border-radius:10px; touch-action:none;}
  .area-cadeia{flex:1 1 0; min-height:0; display:flex; justify-content:center; align-items:center; margin:10px 0; touch-action:none; overflow:hidden;}
  .area-cadeia svg{height:100%; max-height:100%; width:auto; max-width:100%; aspect-ratio:480 / 1142; display:block;}
  .aviso-flutuante{position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 24px); transform:translateX(-50%); background:var(--verde-escuro); color:#fff; padding:10px 16px; border-radius:10px; font-size:14px; z-index:30; max-width:90vw; text-align:center;}
</style>
</head>
<body>
<div id="app"></div>
<script src="nucleo.js"></script>

// ====================== datas ======================
const DIAS = ['domingo', 'segunda-feira', 'terça-feira', 'quarta-feira', 'quinta-feira', 'sexta-feira', 'sábado'];
const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const hojeISO = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const dataBR = (iso) => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso || '')); return m ? `${m[3]}/${m[2]}/${m[1]}` : ''; };
function idade(nasc) {
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(nasc || '')); if (!m) return '';
  const h = new Date(); let a = h.getFullYear() - Number(m[1]);
  if (h.getMonth() + 1 < Number(m[2]) || (h.getMonth() + 1 === Number(m[2]) && h.getDate() < Number(m[3]))) a--;
  return a >= 0 ? a + ' anos' : '';
}
function saudacao() { const h = new Date().getHours(); return h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite'; }
function dataPorExtenso() { const d = new Date(); const s = DIAS[d.getDay()]; return `${s[0].toUpperCase()}${s.slice(1)}, ${d.getDate()} de ${MESES[d.getMonth()]} de ${d.getFullYear()}`; }
function quandoCurto(iso) {
  if (!iso) return '—'; const d = new Date(iso); if (isNaN(d)) return '—';
  const hora = d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  const ontem = new Date(); ontem.setDate(ontem.getDate() - 1);
  if (d.toDateString() === new Date().toDateString()) return 'hoje, ' + hora;
  if (d.toDateString() === ontem.toDateString()) return 'ontem, ' + hora;
  return d.toLocaleDateString('pt-BR') + ', ' + hora;
}

// ====================== dados (mesmas regras do notebook) ======================
const pacientes = () => G.raq_pacientes;
const situacao = (p) => (p && p.situacao) || 'ativo';
const fases = (p) => (p && Array.isArray(p.fases) && p.fases.length) ? p.fases : [{ numero: 1 }];
const faseAtual = (p) => Math.max(...fases(p).map((f) => f.numero));
const chaveFase = (pid, n) => n > 1 ? `${pid}__f${n}` : pid;
const faseDaConsulta = (c) => (c && c.fase) || 1;
const anamneseDaFase = (pid, n) => G.raq_anamnese[chaveFase(pid, n)] || {};
const primeiroNome = (nome) => { const p = String(nome || '').trim().split(/\s+/); return p.length > 1 && /\.$/.test(p[0]) ? p[0] + ' ' + p[1] : (p[0] || ''); };
const nomeExibicao = (u) => (u && (u.nomeExibicao || primeiroNome(u.nome))) || '';
function nomePaciente(id) { const p = pacientes().find((x) => x.id === id); return p ? p.nome : '(paciente removido)'; }
function ultimasConsultas() { const m = {}; for (const c of G.raq_consultas) if (c.pacienteId && c.data && (!m[c.pacienteId] || c.data > m[c.pacienteId])) m[c.pacienteId] = c.data; return m; }
const CORES_STATUS = { 'Confirmada': ['#1d5a8a', '#e3f0fb'], 'Concluída': ['#1d7a6d', '#e3f2ef'], 'Cancelada': ['#a33025', '#fdf1f0'] };
// no notebook, "Aguardando confirmação" é guardado como status vazio
function etiquetaStatus(s) { const c = CORES_STATUS[s] || ['#5c7570', '#eef2f1']; const t = (!s || s === 'Aguardando confirmação') ? 'Aguardando' : s; return `<span class="etiqueta" style="color:${c[0]};background:${c[1]}">${esc(t)}</span>`; }
// financeiro (mesmas regras do notebook: _situacaoPagamento, parseValorReal, formatarReal)
const situacaoPag = (f) => f.pagamento === 'Sim' ? 'pago' : (f.pagamento === 'Abonado' ? 'abonado' : 'pendente');
function etiquetaPag(f) {
  const s = situacaoPag(f);
  if (s === 'pago') return '<span class="etiqueta" style="background:#e3f5ef;color:#1d7a6d">Pago</span>';
  if (s === 'abonado') return '<span class="etiqueta" style="background:#eceef8;color:#4a4f9a">Abonado</span>';
  return '<span class="etiqueta" style="background:#fdeceb;color:#c0392b">Pendente</span>';
}
function valorReal(t) { if (!t) return 0; const n = parseFloat(String(t).replace(/[^\d,.-]/g, '').replace(/\.(?=\d{3})/g, '').replace(',', '.')); return isNaN(n) ? 0 : n; }
const real = (n) => 'R$ ' + n.toFixed(2).replace('.', ',').replace(/(\d)(?=(\d{3})+,)/g, '$1.');
// período (mesmo do notebook: semana de domingo a sábado)
function intervaloPeriodo(periodo, ini, fim) {
  const h = new Date(); h.setHours(0, 0, 0, 0); const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  if (periodo === 'hoje') return [iso(h), iso(h)];
  if (periodo === 'semana') { const i = new Date(h); i.setDate(i.getDate() - i.getDay()); const f = new Date(i); f.setDate(f.getDate() + 6); return [iso(i), iso(f)]; }
  if (periodo === 'mes') return [iso(new Date(h.getFullYear(), h.getMonth(), 1)), iso(new Date(h.getFullYear(), h.getMonth() + 1, 0))];
  if (periodo === 'ano') return [`${h.getFullYear()}-01-01`, `${h.getFullYear()}-12-31`];
  return [ini || '', fim || ''];
}
const noPeriodo = (data, [i, f]) => !(i && String(data || '') < i) && !(f && String(data || '') > f);
const OPCOES_PERIODO = [['hoje', 'Hoje'], ['semana', 'Esta semana'], ['mes', 'Este mês'], ['ano', 'Este ano'], ['personalizado', 'Selecione o período']];
function campoSelect(rotulo, id, opcoes, atual, aoMudar) {
  return `<label class="campo campo-filtro">${esc(rotulo)}<select id="${id}" onchange="${aoMudar}">${opcoes.map(([v, t]) => `<option value="${esc(v)}" ${v === atual ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select></label>`;
}
function camposPeriodo(f, aoMudar) {
  return `${campoSelect('Período', 'f-periodo', OPCOES_PERIODO, f.periodo, `${aoMudar}`)}
    ${f.periodo === 'personalizado' ? `<div class="dupla"><label class="campo campo-filtro">Data inicial<input type="date" id="f-ini" value="${esc(f.ini)}" onchange="${aoMudar}"></label>
      <label class="campo campo-filtro">Data final<input type="date" id="f-fim" value="${esc(f.fim)}" onchange="${aoMudar}"></label></div>` : ''}`;
}
const nomeDoRegistro = (x) => x.pacienteId ? nomePaciente(x.pacienteId) : (x.pacienteNomeAvulso || '—');
const marcaAvulso = (x) => x.pacienteId ? '' : ` <span class="avulso">${x.pacienteExcluido ? '(cadastro excluído)' : '(não cadastrado)'}</span>`;
function semanaCurta(iso) { const d = new Date(iso + 'T00:00:00'); return isNaN(d) ? '' : DIAS[d.getDay()]; }

// ====================== utilidades de tela ======================
function avisar(texto) {
  const a = document.createElement('div'); a.className = 'aviso-flutuante'; a.textContent = texto;
  document.body.appendChild(a); setTimeout(() => a.remove(), Math.min(9000, 2400 + texto.length * 40));
}
function topo(titulo, comVoltar = true) {
  return `<header class="topo">${comVoltar ? `<button class="voltar" aria-label="Voltar" onclick="voltar()">${ICONE.voltar}</button>` : '<span style="width:10px"></span>'}

}
const MARCA = (grande) => `<span class="marca-topo${grande ? ' grande' : ''}"><img src="maos.png" alt=""><span>SGO_RA</span></span>`;
function ir(tela, ...args) { pilha.push([tela, args]); desenhar(); window.scrollTo(0, 0); }
async function voltar() {
  if (formularioAlterado && !(await perguntar('Existem alterações que ainda não foram salvas.\nDeseja sair sem salvar?', 'Sair sem salvar', 'Continuar editando'))) return;
  formularioAlterado = false; _sequenciaNovo = null; selArq = false; arqMarcados.clear();
  if (pilha.length > 1) pilha.pop(); desenhar(); window.scrollTo(0, 0);
}
function desenhar() { const [tela, args] = pilha[pilha.length - 1]; TELAS[tela](...args); }
function abrirFolha(html, textoFechar = 'Fechar') {
  const v = document.createElement('div'); v.className = 'veu';
  v.innerHTML = `<div class="folha">${html}<button class="btn claro" style="margin-top:14px" onclick="this.closest('.veu').remove()">${esc(textoFechar)}</button></div>`;
  v.addEventListener('click', (e) => { if (e.target === v) v.remove(); });
  document.body.appendChild(v);
}

// ====================== início ======================
// Abre o que está guardado no celular. Um erro de leitura (o iPhone às vezes perde a ligação com o armazém quando o
// aplicativo volta do segundo plano) NUNCA leva a "Configurar este celular": tenta de novo e, se não der, avisa.
async function lerComTentativas(fn) {
  let ultimoErro;
  for (let i = 0; i < 4; i++) {
    try { return { ok: true, valor: await fn() }; } catch (e) { ultimoErro = e; await new Promise((r) => setTimeout(r, 400 * (i + 1))); }
  }
  return { ok: false, erro: ultimoErro };
}
async function iniciar() {
  const rc = await lerComTentativas(() => A.ler('chave'));
  if (!rc.ok) { telaErroArmazem(); return; }
  chave = rc.valor || null;
  if (!chave) { pilha = [['configurar', [1]]]; desenhar(); return; }
  const re = await lerComTentativas(() => A.lerEstado(chave));
  if (!re.ok) { telaErroArmazem(); return; }
  estado = re.valor || null;
  if (!estado) { pilha = [['configurar', [1]]]; desenhar(); return; }
  G = N.montarGavetas(estado);
  guardarParaSempre();
  pilha = [['entrar', []]]; desenhar();
}
function telaErroArmazem() {
  app.innerHTML = `<div class="tela-entrada"><img src="maos.png" alt=""><p class="marca">SGO_RA</p><div class="quadro-entrada">
    <h1>Não foi possível abrir os dados</h1>
    <p class="aviso">Os dados deste celular continuam guardados. Feche o aplicativo e abra de novo.</p>
    <button class="btn" onclick="iniciar()">Tentar de novo</button></div></div>`;
}
// pede ao aparelho para não apagar os dados do aplicativo quando faltar espaço
function guardarParaSempre() { try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) { /* sem efeito */ } }

// ====================== configurar este celular (1ª vez) ======================
const TELAS = {};
TELAS.configurar = (passo, erro) => {
  const corpo = passo === 1 ? `
      <h1>Configurar este celular</h1>
      <div class="passos"><span class="feito"></span><span></span><span></span></div>
      <p class="aviso">Entre na conta Google da clínica, a mesma do notebook.</p>
      ${erro ? `<p class="aviso erro">${esc(erro)}</p>` : ''}
      <button class="btn" id="btn-google" onclick="configurarGoogle()">Entrar com o Google</button>`
    : passo === 2 ? `
      <h1>Configurar este celular</h1>
      <div class="passos"><span class="feito"></span><span class="feito"></span><span></span></div>
      <label class="campo">Código do cofre
        <input id="codigo-cofre" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX-XXXX-XXXX-XXXX-XXXX"></label>
      <p class="aviso">Digite o código do cofre que está na folha do kit.</p>
      ${erro ? `<p class="aviso erro">${esc(erro)}</p>` : ''}
      <button class="btn" id="btn-codigo" onclick="configurarCodigo()">Continuar</button>`
    : `
      <h1>Configurar este celular</h1>
      <div class="passos"><span class="feito"></span><span class="feito"></span><span class="feito"></span></div>
      <p class="aviso" id="progresso-texto">Trazendo os dados do notebook...</p>
      <div class="barra"><div id="progresso-barra"></div></div>`;
  app.innerHTML = `<div class="tela-entrada"><img src="maos.png" alt=""><p class="marca">SGO_RA</p><div class="quadro-entrada">${corpo}</div>
    <p class="rodape-entrada">Os dados ficam criptografados neste celular.</p></div>`;
};
async function configurarGoogle() {
  const b = document.getElementById('btn-google'); b.disabled = true;
  try { await D.entrar(); pilha = [['configurar', [2]]]; desenhar(); }
  catch (e) { pilha = [['configurar', [1, e.message === 'CANCELADO' ? '' : e.message]]]; desenhar(); }
}
async function configurarCodigo() {
  const codigo = document.getElementById('codigo-cofre').value;
  const b = document.getElementById('btn-codigo'); b.disabled = true; b.textContent = 'Conferindo...';
  try {
    const cab = await D.transporte.ler(N.ARQ_CABECALHO);
    if (!cab) throw Object.assign(new Error('A sincronização ainda não foi ligada no notebook.'), {});
    const k = await N.abrirCadeado(new TextDecoder().decode(cab), codigo);
    pilha = [['configurar', [3]]]; desenhar();
    const est = N.novoEstado();
    await N.lerNovidades(k, D.transporte, est, (i, n) => {
      document.getElementById('progresso-texto').textContent = `Trazendo os dados do notebook... (${i} de ${n})`;
      document.getElementById('progresso-barra').style.width = Math.round(i / n * 100) + '%';
    });
    est.ultima = new Date().toISOString();
    await A.gravar('chave', k); await A.gravarEstado(k, est);
    chave = k; estado = est; G = N.montarGavetas(est); guardarParaSempre();
    pilha = [['entrar', []]]; desenhar();
  } catch (e) {
    const msg = e.code === 'CODIGO_INCORRETO' ? 'Código do cofre incorreto. Confira a folha do kit.' : e.code === 'CODIGO_INVALIDO' ? 'O código tem 24 letras e números. Confira a folha do kit.' : e.message;
    pilha = [['configurar', [e.code === 'SEM_PASSE' ? 1 : 2, msg]]]; desenhar();
  }
}

// ====================== entrar ======================
const TENTATIVAS = 'sgora_tentativas';
TELAS.entrar = (erro) => {
  const temBio = Object.keys(lerBio()).length > 0;
  let ultimo = ''; try { ultimo = localStorage.getItem(ULTIMO_LOGIN) || ''; } catch (e) { /* nada */ }
  app.innerHTML = `<div class="tela-entrada"><img src="maos.png" alt=""><p class="marca">SGO_RA</p>
    <form class="quadro-entrada" onsubmit="event.preventDefault(); entrarNoSistema()">
      <div><h1>Sistema de gestão em osteopatia</h1><p class="sub">acesso restrito</p></div>
      ${temBio ? `<button type="button" class="btn medio" id="btn-bio" style="min-height:56px;font-size:18px" onclick="entrarComBio()">${ICONE.rosto}Entrar com ${esc(nomeBio())}</button>
        <p class="sub" style="margin:0">ou entre com a senha</p>` : ''}
      <label class="campo">Usuário<input id="login-usuario" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="nome.sobrenome" value="${esc(ultimo)}"></label>
      <label class="campo">Senha<span class="senha"><input id="login-senha" type="password" autocomplete="current-password" placeholder="Digite sua senha">
        <button type="button" aria-label="Mostrar senha" onclick="const i=document.getElementById('login-senha'); i.type = i.type==='password'?'text':'password'">${ICONE.olhoCinza}</button></span></label>
      ${erro ? `<p class="aviso erro">${esc(erro)}</p>` : ''}
      <button class="btn" type="submit" id="btn-entrar" style="margin-top:6px; min-height:52px; font-size:18px">Entrar</button>
    </form>
    <p class="rodape-entrada">O mesmo usuário e a mesma senha do notebook.</p></div>`;
};
async function entrarNoSistema() {
  const login = document.getElementById('login-usuario').value.trim().toLowerCase();
  const senha = document.getElementById('login-senha').value;
  let t = {}; try { t = JSON.parse(localStorage.getItem(TENTATIVAS) || '{}'); } catch (e) { t = {}; }
  const reg = t[login] || { n: 0, ate: 0 };
  if (reg.ate > Date.now()) { TELAS.entrar('Muitas tentativas. Aguarde 5 minutos.'); return; }
  const b = document.getElementById('btn-entrar'); b.disabled = true; b.textContent = 'Conferindo...';
  const u = G.raq_usuarios.find((x) => String(x.login || '').toLowerCase() === login);
  const certo = u && await N.conferirSenha(u, senha);
  if (!certo) {
    reg.n++; if (reg.n >= 5) { reg.ate = Date.now() + 5 * 60 * 1000; reg.n = 0; }
    t[login] = reg; try { localStorage.setItem(TENTATIVAS, JSON.stringify(t)); } catch (e) { /* nada */ }
    TELAS.entrar(reg.ate > Date.now() ? 'Muitas tentativas. Aguarde 5 minutos.' : 'Usuário ou senha incorretos.'); return;
  }
  delete t[login]; try { localStorage.setItem(TENTATIVAS, JSON.stringify(t)); } catch (e) { /* nada */ }
  if (!podeEntrar(u)) return;
  await concluirEntrada(u);
  oferecerBio(u);
}
function podeEntrar(u) {
  if (u.trocarSenha) { TELAS.entrar('Troque a senha provisória no notebook antes de usar o celular.'); return false; }
  if (!FUNCOES_COM_CELULAR.includes(u.funcao)) { TELAS.entrar('Este usuário não tem acesso ao celular.'); return false; }
  return true;
}
async function concluirEntrada(u) {
  try { localStorage.setItem(ULTIMO_LOGIN, u.login); } catch (e) { /* nada */ }
  usuario = u; pilha = [['hoje', []]]; desenhar();
  atualizar(true);
}
function sair() { usuario = null; pilha = [['entrar', []]]; desenhar(); }

// ====================== Face ID / digital (chave de acesso do próprio aparelho) ======================
// Nada sai do celular: o aparelho confere o rosto ou a digital e libera a entrada. A senha continua valendo.
// Se a senha mudar no notebook, o Face ID deste usuário se desliga e é preciso entrar uma vez com a senha nova.
const BIO = 'sgora_bio', BIO_PERGUNTADO = 'sgora_bio_perguntado', ULTIMO_LOGIN = 'sgora_ultimo_login';
const ehIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const nomeBio = () => ehIOS ? 'Face ID' : 'biometria';
const oBio = () => ehIOS ? 'o Face ID' : 'a biometria';
const bioLigado = (sim) => ehIOS ? (sim ? 'Face ID ligado.' : 'Face ID desligado.') : (sim ? 'Biometria ligada.' : 'Biometria desligada.');
const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
const deB64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
function lerBio() { try { return JSON.parse(localStorage.getItem(BIO) || '{}') || {}; } catch (e) { return {}; } }
function gravarBio(v) { try { localStorage.setItem(BIO, JSON.stringify(v)); } catch (e) { /* nada */ } }
// No iPhone, o app da Tela de Início às vezes responde "não disponível" mesmo com o Face ID ligado:
// lá, tenta assim mesmo (se falhar, o aviso mostra o motivo).
async function bioDisponivel() {
  if (!window.PublicKeyCredential || !navigator.credentials) return false;
  try { if (await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()) return true; } catch (e) { /* segue */ }
  return ehIOS;
}
const motivoBio = (e) => e && e.name ? ` (${e.name}${e.message ? ': ' + String(e.message).slice(0, 80) : ''})` : '';
// "Impressão" da senha atual (curta, não serve para descobrir a senha): muda quando a senha muda no notebook
async function marcaSenha(u) {
  const h = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('sgora-bio|' + u.salt + '|' + u.senhaHash));
  return b64(h).slice(0, 12);
}
async function ligarBio(u) {
  const cred = await navigator.credentials.create({ publicKey: {
    challenge: crypto.getRandomValues(new Uint8Array(32)),
    rp: { name: 'SGO_RA' },
    user: { id: new TextEncoder().encode(String(u.id)), name: u.login, displayName: u.nome || u.login },
    pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
    authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'discouraged' },
    attestation: 'none', timeout: 60000 } });
  const b = lerBio(); b[u.login] = { id: b64(cred.rawId), marca: await marcaSenha(u) }; gravarBio(b);
}
function desligarBio(login) { const b = lerBio(); delete b[login]; gravarBio(b); }
async function entrarComBio() {
  const b = lerBio(); const logins = Object.keys(b); if (!logins.length) return;
  const botao = document.getElementById('btn-bio'); if (botao) botao.disabled = true;
  let cred;
  try {
    cred = await navigator.credentials.get({ publicKey: { challenge: crypto.getRandomValues(new Uint8Array(32)),
      allowCredentials: logins.map((l) => ({ type: 'public-key', id: deB64(b[l].id) })), userVerification: 'required', timeout: 60000 } });
  } catch (e) { if (botao) botao.disabled = false; if (e.name !== 'NotAllowedError' && e.name !== 'AbortError') avisar('Não foi possível usar ' + oBio() + '. Entre com a senha.' + motivoBio(e)); return; }
  const idUsado = b64(cred.rawId);
  const login = logins.find((l) => b[l].id === idUsado);
  const u = login && G.raq_usuarios.find((x) => String(x.login || '').toLowerCase() === login.toLowerCase());
  if (!u) { if (login) desligarBio(login); TELAS.entrar('Usuário não encontrado. Entre com a senha.'); return; }
  if (b[login].marca !== await marcaSenha(u)) {
    desligarBio(login);
    try { localStorage.setItem(BIO_PERGUNTADO, JSON.stringify(JSON.parse(localStorage.getItem(BIO_PERGUNTADO) || '[]').filter((l) => l !== login))); } catch (e) { /* nada */ }
    TELAS.entrar('A senha mudou no notebook. Entre com a senha nova para usar ' + oBio() + ' de novo.'); return;
  }
  if (!podeEntrar(u)) return;
  await concluirEntrada(u);
}
// Pergunta só na primeira entrada com senha deste usuário neste celular
async function oferecerBio(u) {
  let perguntados = []; try { perguntados = JSON.parse(localStorage.getItem(BIO_PERGUNTADO) || '[]'); } catch (e) { perguntados = []; }
  if (lerBio()[u.login] || perguntados.includes(u.login) || !(await bioDisponivel())) return;
  perguntados.push(u.login); try { localStorage.setItem(BIO_PERGUNTADO, JSON.stringify(perguntados)); } catch (e) { /* nada */ }
  abrirFolha(`<h2>Usar ${esc(oBio())} para entrar?</h2>
    <p style="margin:0 0 14px;font-size:15px;color:var(--texto-sec)">Na próxima vez, você entra sem digitar a senha. A senha continua valendo. Você pode mudar isso em Configurações.</p>
    <button class="btn" id="btn-ligar-bio" onclick="ligarBioDaFolha(this)">${ICONE.rosto}Usar ${esc(oBio())}</button>`, 'Agora não');
}
async function ligarBioDaFolha(botao) {
  botao.disabled = true;
  try { await ligarBio(usuario); botao.closest('.veu').remove(); avisar(bioLigado(true)); }
  catch (e) { botao.disabled = false; if (e.name !== 'NotAllowedError' && e.name !== 'AbortError') avisar('Não foi possível ligar ' + oBio() + '.' + motivoBio(e)); }
}

let atualizando = false, situacaoSinc = { erro: null };
async function atualizar(silencioso) {
  if (atualizando || !chave) return;
  if (!D.temPasse()) { situacaoSinc = { erro: 'SEM_PASSE' }; redesenharSituacao(); return; }
  atualizando = true; redesenharSituacao();
  try {
    const r = await N.lerNovidades(chave, D.transporte, estado);
    reconciliarPendentes();
    const enviadas = await enviarPendentes();
    estado.ultima = new Date().toISOString();
    await A.gravarEstado(chave, estado);
    situacaoSinc = { erro: null };
    if (r.recebidas) { G = N.montarGavetas(estado); const u = G.raq_usuarios.find((x) => x.id === usuario.id); if (u) usuario = u; if (!document.querySelector('.veu') && !formularioAlterado) desenhar(); }
    if (!silencioso) avisar(r.recebidas ? 'Dados atualizados.' : enviadas ? 'Alterações enviadas ao notebook.' : 'Tudo em dia.');
  } catch (e) {
    situacaoSinc = { erro: e.code || 'ERRO', mensagem: e.message };
    if (!silencioso) avisar(e.code === 'SEM_INTERNET' ? 'Sem internet. Tente mais tarde.' : e.message);
  } finally { atualizando = false; redesenharSituacao(); }
}
async function atualizarComGoogle() {
  try { await D.entrar(); await atualizar(false); } catch (e) { if (e.message !== 'CANCELADO') avisar(e.message); }
}
// ====================== gravar no celular e enviar ao notebook ======================
// Toda alteração feita aqui: (1) vale na hora no celular; (2) fica guardada (criptografada) como "pendente";
// (3) vai para o Google Drive num lote — na hora, se houver internet, ou na próxima atualização.
let formularioAlterado = false;
async function salvarRegistro(k, valorNovo) {
  const em = new Date().toISOString();
  const v = { ...valorNovo, [N.CAMPO_CARIMBO]: em };
  const atual = estado.registros.get(k);
  const pend = estado.pendentes.get(k);
  estado.pendentes.set(k, { v, em, base: pend ? pend.base : (atual && atual.v) || null });
  estado.registros.set(k, { v, em });
  G = N.montarGavetas(estado);
  await A.gravarEstado(chave, estado);
  enviarPendentes().then((n) => { if (n) A.gravarEstado(chave, estado); redesenharSituacao(); }).catch(() => redesenharSituacao());
  return v;
}
// exclusão: vai para o notebook como "excluído" (lá vira lápide, como uma exclusão feita no próprio notebook)
async function excluirRegistro(k) {
  const em = new Date().toISOString();
  const atual = estado.registros.get(k);
  const pend = estado.pendentes.get(k);
  estado.pendentes.set(k, { v: null, em, base: pend ? pend.base : (atual && atual.v) || null });
  estado.registros.set(k, { v: null, em });
  G = N.montarGavetas(estado);
  await A.gravarEstado(chave, estado);
  enviarPendentes().then((n) => { if (n) A.gravarEstado(chave, estado); redesenharSituacao(); }).catch(() => redesenharSituacao());
}
// chegou de outro aparelho uma versão mais nova de um registro que o celular também mudou: junta campo a campo
function reconciliarPendentes() {
  for (const [k, p] of estado.pendentes) {
    const r = estado.registros.get(k);
    if (!r || r.em === p.em) continue;
    if (!p.v) { estado.registros.set(k, { v: null, em: p.em }); continue; }   // excluído no celular: continua excluído
    const em = new Date().toISOString();
    const v = { ...N.juntarComRemoto(p.v, p.base, r.v), [N.CAMPO_CARIMBO]: em };
    estado.pendentes.set(k, { v, em, base: r.v });
    estado.registros.set(k, { v, em });
  }
  G = N.montarGavetas(estado);
}
let enviando = null;
async function enviarPendentes() {
  if (!estado.pendentes.size || !D.temPasse()) return 0;
  // já está enviando: espera terminar e manda o que chegou nesse meio-tempo (nada fica parado no celular)
  if (enviando) { try { await enviando; } catch (e) { /* tenta de novo abaixo */ } return enviarPendentes(); }
  enviando = (async () => {
    let total = 0;
    while (estado.pendentes.size && D.temPasse()) {
      // primeiro o conteúdo dos arquivos anexados no celular (o notebook só aceita o arquivo se o conteúdo já estiver lá)
      for (const a of (estado.anexosPendentes || []).slice()) {
        const conteudo = await A.lerTexto(chave, `anexo_${a.id}_${a.campo}`);
        if (conteudo) await N.enviarAnexo(chave, D.transporte, a.id, a.campo, conteudo);
        estado.anexosPendentes = estado.anexosPendentes.filter((x) => !(x.id === a.id && x.campo === a.campo));
        await A.gravarEstado(chave, estado);
        A.apagarTexto(`anexo_${a.id}_${a.campo}`).catch(() => {});
      }
      const lista = [...estado.pendentes].map(([k, p]) => ({ k, v: p.v, em: p.em }));
      const nome = await N.enviarLote(chave, D.transporte, estado.aparelho, lista);
      estado.aplicados.add(nome);
      for (const m of lista) { const p = estado.pendentes.get(m.k); if (p && p.em === m.em) estado.pendentes.delete(m.k); }
      total += lista.length;
    }
    return total;
  })();
  try { return await enviando; } finally { enviando = null; }
}
// pergunta simples na folha de baixo: devolve true (sim) ou false (não)
function perguntar(texto, sim, nao) {
  return new Promise((ok) => {
    const v = document.createElement('div'); v.className = 'veu';
    v.innerHTML = `<div class="folha"><p style="margin:0 0 16px;font-size:16px;white-space:pre-line;color:var(--texto)">${esc(texto)}</p>
      <button class="btn" data-r="1">${esc(sim)}</button><button class="btn claro" style="margin-top:10px" data-r="0">${esc(nao)}</button></div>`;
    v.addEventListener('click', (e) => { const b = e.target.closest('button[data-r]'); if (b) { v.remove(); ok(b.dataset.r === '1'); } });
    document.body.appendChild(v);
  });
}

  if (situacaoSinc.erro === 'SEM_PASSE') return 'Toque para atualizar com o Google.';
  if (situacaoSinc.erro === 'SEM_INTERNET') return 'Sem internet. Mostrando os dados de ' + quandoCurto(estado.ultima) + '.';
  if (situacaoSinc.erro) return 'Não foi possível atualizar. Toque para tentar de novo.';
  return 'Tudo em dia com o notebook (' + quandoCurto(estado.ultima) + ').';
}

function listarPacientes() {
  const ult = ultimasConsultas();
  const termo = filtroPac.busca.trim().toLowerCase();
  const semAcento = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  let lista = pacientes().filter((p) => situacao(p) === filtroPac.sit);
  if (termo) {
    const t = semAcento(termo);
    lista = lista.filter((p) => {
      const queixas = fases(p).map((f) => anamneseDaFase(p.id, f.numero).queixaPrincipal || '').join(' ');
      return [p.nome, p.cpf, p.celular, p.telefone, p.bairro, p.cidade, queixas].some((v) => semAcento(v).includes(t));
    });
  }
  if (filtroPac.ordem === 'nome') lista.sort((a, b) => String(a.nome).localeCompare(String(b.nome), 'pt-BR'));

// Figura da cadeia lesional com as marcações. Igual ao notebook: caixa 480×1142 (a imagem estica na caixa),
// coordenadas em % da caixa, raio do círculo em % da largura.
const CAIXA_W = 480, CAIXA_H = 1142;
function figuraCadeia(lado, marcas) {
  const X = (p) => p * CAIXA_W / 100, Y = (p) => p * CAIXA_H / 100;
  const seta = (x1, y1, x2, y2) => {
    const esp = 5, ang = Math.atan2(y2 - y1, x2 - x1), cab = esp * 4.2;
    const p1 = [x2 - cab * Math.cos(ang - 0.45), y2 - cab * Math.sin(ang - 0.45)], p2 = [x2 - cab * Math.cos(ang + 0.45), y2 - cab * Math.sin(ang + 0.45)];
    const bx = x2 - cab * 0.8 * Math.cos(ang), by = y2 - cab * 0.8 * Math.sin(ang);
    return `<line x1="${x1}" y1="${y1}" x2="${bx}" y2="${by}" stroke="#c0392b" stroke-width="${esp}" stroke-linecap="round"/><polygon points="${x2},${y2} ${p1[0]},${p1[1]} ${p2[0]},${p2[1]}" fill="#c0392b"/>`;
  };
  const desenho = (marcas || []).map((m) => {
    const tipo = m.tipo || 'ponto';
    if (tipo === 'ponto') return `<circle cx="${X(m.x)}" cy="${Y(m.y)}" r="11" fill="#c0392b" stroke="#fff" stroke-width="3"/>`;
    if (tipo === 'circulo') return `<circle cx="${X(m.x)}" cy="${Y(m.y)}" r="${X(m.r)}" fill="none" stroke="#c0392b" stroke-width="5"/>`;
    return seta(X(m.x1), Y(m.y1), X(m.x2), Y(m.y2));
  }).join('');
  return `<svg class="fig-cadeia" viewBox="0 0 ${CAIXA_W} ${CAIXA_H}" role="img" aria-label="${lado === 'frente' ? 'Frente' : 'Costas'}">
    <rect width="${CAIXA_W}" height="${CAIXA_H}" rx="20" fill="#cdeae3"/>
    <image href="cadeia_${lado}.png" width="${CAIXA_W}" height="${CAIXA_H}" preserveAspectRatio="none"/>${desenho}</svg>`;
}

let _ferramenta = 'ponto', _arraste = null;
function editarCadeia(lado) {
  const v = document.createElement('div'); v.className = 'veu veu-cheio'; v.id = 'editor-cadeia';
  v.innerHTML = `<div class="folha folha-cheia folha-doc"><h2>Cadeia lesional — ${lado === 'frente' ? 'Frente' : 'Costas'}</h2>
    <div class="seg" id="ferramentas">${[['ponto', 'Ponto'], ['circulo', 'Círculo'], ['seta', 'Seta']].map(([f, t]) => `<button type="button" data-f="${f}" class="${_ferramenta === f ? 'ativo' : ''}" onclick="_ferramenta='${f}'; document.querySelectorAll('#ferramentas button').forEach(b => b.classList.toggle('ativo', b.dataset.f === _ferramenta))">${t}</button>`).join('')}</div>
    <div class="area-cadeia" id="area-cadeia" data-lado="${lado}"></div>
    <div class="dupla"><button type="button" class="btn claro" id="btn-desfazer-cadeia" onclick="desfazerCadeiaCel()">↶ Desfazer</button><button type="button" class="btn claro" onclick="limparCadeiaCel()">Limpar marcações</button></div>
    <button class="btn" type="button" style="margin-top:10px" onclick="fecharEditorCadeia()">Pronto</button></div>`;
  document.body.appendChild(v);
  desenharEditorCadeia();
  const area = v.querySelector('#area-cadeia');
  // a medida da figura é tirada uma vez, no toque: durante o arraste a figura é redesenhada (a de antes sai da tela)
  area.addEventListener('pointerdown', (ev) => { const r = area.querySelector('svg').getBoundingClientRect(); const p = posNaFigura(ev, r); _arraste = { lado, r, x0: p.x, y0: p.y, x: p.x, y: p.y, w: p.w, h: p.h }; try { area.setPointerCapture(ev.pointerId); } catch (e) { /* nada */ } ev.preventDefault(); });
  area.addEventListener('pointermove', (ev) => { if (!_arraste) return; const p = posNaFigura(ev, _arraste.r); _arraste.x = p.x; _arraste.y = p.y; if (_ferramenta !== 'ponto') desenharEditorCadeia(); });
  // no iPhone, arrastar o dedo na figura não pode rolar a tela (senão o círculo/seta é cancelado no meio)
  area.addEventListener('touchmove', (ev) => ev.preventDefault(), { passive: false });
  const fim = () => { if (_arraste) fimArrasteCadeia(); };
  area.addEventListener('pointerup', fim); area.addEventListener('pointercancel', fim);
}
function posNaFigura(ev, r) { return { x: (ev.clientX - r.left) / r.width * 100, y: (ev.clientY - r.top) / r.height * 100, w: r.width, h: r.height }; }
function desenharEditorCadeia() {
  const area = document.getElementById('area-cadeia'); if (!area) return;
  const lado = area.dataset.lado;
  const itens = _exEd.mc[lado].slice(), a = _arraste;
  if (a && _ferramenta !== 'ponto') itens.push(_ferramenta === 'circulo'
    ? { tipo: 'circulo', x: a.x0, y: a.y0, r: Math.hypot((a.x - a.x0) * a.w / 100, (a.y - a.y0) * a.h / 100) / a.w * 100 }
    : { tipo: 'seta', x1: a.x0, y1: a.y0, x2: a.x, y2: a.y });
  area.innerHTML = figuraCadeia(lado, itens);
  document.getElementById('btn-desfazer-cadeia').disabled = !_exEd.desfazerCadeia.length;
}
function marcacaoProxima(lado, p) {   // _marcacaoProxima do notebook (com distância maior, para o dedo)
  const px = (x, y) => ({ x: x * p.w / 100, y: y * p.h / 100 }); const c = px(p.x, p.y);
  let melhor = -1, menor = 18;
  _exEd.mc[lado].forEach((m, i) => {
    let d; const tipo = m.tipo || 'ponto';
    if (tipo === 'ponto') { const q = px(m.x, m.y); d = Math.hypot(q.x - c.x, q.y - c.y); }
    else if (tipo === 'circulo') { const q = px(m.x, m.y); d = Math.abs(Math.hypot(q.x - c.x, q.y - c.y) - m.r * p.w / 100); }
    else { const a = px(m.x1, m.y1), b = px(m.x2, m.y2); const vx = b.x - a.x, vy = b.y - a.y, l2 = vx * vx + vy * vy || 1;
      const t = Math.max(0, Math.min(1, ((c.x - a.x) * vx + (c.y - a.y) * vy) / l2)); d = Math.hypot(a.x + t * vx - c.x, a.y + t * vy - c.y); }
    if (d < menor) { menor = d; melhor = i; }
  });
  return melhor;
}
function fimArrasteCadeia() {
  const a = _arraste; _arraste = null;
  const lista = _exEd.mc[a.lado], antes = JSON.stringify(_exEd.mc);
  const arrastou = Math.hypot((a.x - a.x0) * a.w / 100, (a.y - a.y0) * a.h / 100);
  if (arrastou < 8) {
    const i = marcacaoProxima(a.lado, { x: a.x0, y: a.y0, w: a.w, h: a.h });
    if (i > -1) lista.splice(i, 1);
    else if (_ferramenta === 'ponto') lista.push({ x: a.x0, y: a.y0 });
    else { desenharEditorCadeia(); return; }
  } else if (_ferramenta === 'circulo') lista.push({ tipo: 'circulo', x: a.x0, y: a.y0, r: arrastou / a.w * 100 });
  else if (_ferramenta === 'seta') lista.push({ tipo: 'seta', x1: a.x0, y1: a.y0, x2: a.x, y2: a.y });
  else lista.push({ x: a.x, y: a.y });
  _exEd.desfazerCadeia.push(antes); formularioAlterado = true;
  desenharEditorCadeia();
}
function desfazerCadeiaCel() { const s = _exEd.desfazerCadeia.pop(); if (s) { _exEd.mc = JSON.parse(s); desenharEditorCadeia(); } }
async function limparCadeiaCel() {
  if (!_exEd.mc.frente.length && !_exEd.mc.costas.length) return;
  if (!(await perguntar('Limpar todas as marcações da imagem?', 'Limpar', 'Cancelar'))) return;
  _exEd.desfazerCadeia.push(JSON.stringify(_exEd.mc)); _exEd.mc = { frente: [], costas: [] }; formularioAlterado = true; desenharEditorCadeia();
}
function fecharEditorCadeia() { const v = document.getElementById('editor-cadeia'); if (v) v.remove(); const f = document.getElementById('figs-ed'); if (f) f.innerHTML = figurasEd(); }

// desenho livre: quadro de 500×500 como no notebook, traço vermelho
function prepararDesenhoCel() {
  const c = document.getElementById('canvas-livre-cel'); if (!c) return;
  const ctx = c.getContext('2d');
  if (_exEd.desenho) { const img = new Image(); img.onload = () => ctx.drawImage(img, 0, 0, c.width, c.height); img.src = _exEd.desenho; }
  let desenhando = false;
  const pos = (ev) => { const r = c.getBoundingClientRect(); return { x: (ev.clientX - r.left) * c.width / r.width, y: (ev.clientY - r.top) * c.height / r.height }; };
  c.addEventListener('pointerdown', (ev) => {
    ev.preventDefault(); desenhando = true;
    _exEd.desfazerDesenho.push(ctx.getImageData(0, 0, c.width, c.height)); if (_exEd.desfazerDesenho.length > 50) _exEd.desfazerDesenho.shift();
    document.getElementById('btn-desfazer-desenho').disabled = false;
    const p = pos(ev); ctx.beginPath(); ctx.moveTo(p.x, p.y);
    try { c.setPointerCapture(ev.pointerId); } catch (e) { /* nada */ }
  });
  c.addEventListener('pointermove', (ev) => {
    if (!desenhando) return; ev.preventDefault();
    const p = pos(ev); ctx.lineTo(p.x, p.y); ctx.strokeStyle = '#c0392b'; ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke();
    _exEd.desenhou = true; formularioAlterado = true;
  });
  const parar = () => { desenhando = false; };
  c.addEventListener('pointerup', parar); c.addEventListener('pointercancel', parar);
  c.addEventListener('touchmove', (ev) => ev.preventDefault(), { passive: false });   // iPhone: desenhar não rola a tela
}
function desfazerDesenhoCel() {
  const c = document.getElementById('canvas-livre-cel'); const s = _exEd.desfazerDesenho.pop();
  if (s) { c.getContext('2d').putImageData(s, 0, 0); _exEd.desenhou = true; formularioAlterado = true; }
  document.getElementById('btn-desfazer-desenho').disabled = !_exEd.desfazerDesenho.length;
}
function limparDesenhoCel() {
  const c = document.getElementById('canvas-livre-cel'); const ctx = c.getContext('2d');
  _exEd.desfazerDesenho.push(ctx.getImageData(0, 0, c.width, c.height)); document.getElementById('btn-desfazer-desenho').disabled = false;
  ctx.clearRect(0, 0, c.width, c.height); _exEd.desenhou = true; formularioAlterado = true;
}
async function salvarExameCel(id) {
  const f = document.getElementById('form-ex');

  const anterior = G.raq_exame[chaveFase(id, _exEd.n)] || {};

  await salvarRegistro('raq_exame|' + chaveFase(id, _exEd.n), dados);

function lerFiltroFin() {

// totais: com filtro de pagamento, só o da situação escolhida; sem filtro, recebido e pendente (+ abonado, se houver)
function totaisHtml(lista, filtroPagamento) {
  let rec = 0, pen = 0, abo = 0;
  lista.forEach((f) => { const v = valorReal(f.valor), s = situacaoPag(f); if (s === 'pago') rec += v; else if (s === 'abonado') abo += v; else pen += v; });
  const so = { Sim: 'pago', 'Não': 'pendente', Abonado: 'abonado' }[filtroPagamento];
  const it = (n, v) => `<div>${n}<b>${v}</b></div>`;
  const partes = [it('Lançamentos', lista.length)];
  if (!so || so === 'pago') partes.push(it('Recebido', real(rec)));
  if (!so || so === 'pendente') partes.push(it('Pendente', real(pen)));
  if (so === 'abonado' || (!so && abo)) partes.push(it('Abonado', real(abo)));
  return lista.length ? partes.join('') : '';
}
function listarFinanceiro() {
  const termo = filtroFin.busca.trim().toLowerCase();
  const per = intervaloPeriodo(filtroFin.periodo, filtroFin.ini, filtroFin.fim);
  let lista = G.raq_financeiro.filter((f) => noPeriodo(f.data, per) && (filtroFin.pagamento === 'todos' || f.pagamento === filtroFin.pagamento) && (filtroFin.nota === 'todos' || f.notaFiscal === filtroFin.nota));
  if (termo) lista = lista.filter((f) => nomeDoRegistro(f).toLowerCase().includes(termo));
  lista.sort((a, b) => String(a.data || '').localeCompare(String(b.data || '')) * (filtroFin.desc ? -1 : 1));
  document.getElementById('totais-fin').innerHTML = totaisHtml(lista, filtroFin.pagamento);
  document.getElementById('titulo-lista').textContent = `${lista.length} ${lista.length === 1 ? 'lançamento' : 'lançamentos'}`;
  document.getElementById('btn-ordem').textContent = filtroFin.desc ? 'Data ▼ mais recentes' : 'Data ▲ mais antigas';
  const caixa = document.getElementById('lista-fin');
  caixa.style.display = lista.length ? '' : 'none';
  caixa.innerHTML = lista.map((f) => linhaLancamento(f, true)).join('');

  if (!lista.length) caixa.insertAdjacentHTML('afterend', '<p class="vazio" id="fin-vazio">Nenhum lançamento encontrado para os filtros selecionados.</p>');

    try { await navigator.share({ files: [arquivo], title: nome }); } catch (e) { /* cancelou */ }
    return;
  }
  const url = URL.createObjectURL(blob); const l = document.createElement('a'); l.href = url; l.download = arquivo.name; document.body.appendChild(l); l.click(); l.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

const minutos = (h) => { const m = /^(\d{1,2}):(\d{2})/.exec(h || ''); return m ? (+m[1]) * 60 + (+m[2]) : null; };
function conflitoNaAgenda(data, horario, duracao, ignorarId) {
  const ini = minutos(horario); if (ini === null) return null;
  const fim = ini + (Number(duracao) || 60);
  return G.raq_agendamentos.find((a) => {
    if (a.id === ignorarId || a.data !== data || a.status === 'Cancelada') return false;
    const i2 = minutos(a.horario);
    return i2 !== null && ini < i2 + (Number(a.duracao) || 60) && i2 < fim;
  }) || null;
}
const pacientesParaEscolher = () => pacientes().filter((p) => situacao(p) !== 'excluido').sort((a, b) => String(a.nome).localeCompare(String(b.nome), 'pt-BR'));

    <div class="campo campo-form" id="grp-pac-sel"${avulso ? ' style="display:none"' : ''}><label for="busca-paciente-form">Paciente</label>
      <input type="search" id="busca-paciente-form" placeholder="Digite o nome do paciente..." autocomplete="off" value="${esc(pidAtual ? nomePaciente(pidAtual) : '')}" oninput="sugerirPacientes(this, true)">
      <input type="hidden" name="pacienteId" value="${esc(pidAtual || '')}">
      <div class="sugestoes" id="sugestoes-pac"></div></div>
    <label class="campo campo-form" id="grp-pac-avulso"${avulso ? '' : ' style="display:none"'}>Nome do paciente (ainda não cadastrado)<input type="text" name="pacienteNomeAvulso" value="${esc(nomeAvulso || '')}" placeholder="Nome completo" autocapitalize="words" autocomplete="off"></label>`;
}

const semAcentoTxt = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
function sugerirPacientes(el, digitou) {

  const t = semAcentoTxt(el.value.trim()), caixa = document.getElementById('sugestoes-pac');

  caixa.innerHTML = achados.length ? achados.map((p) => `<button type="button" onclick="escolherPaciente('${esc(p.id)}')"><b>${esc(p.nome)}</b>${situacao(p) === 'alta' ? ' <span class="avulso">(com alta)</span>' : ''}<span>${esc([p.celular, p.nascimento ? idade(p.nascimento) : ''].filter(Boolean).join(' · '))}</span></button>`).join('')
    : '<p class="vazio" style="padding:8px">Nenhum paciente com esse nome. Se for novo, marque "Paciente ainda não cadastrado no sistema".</p>';
}

function lerPacienteForm(f, pidFixo) {
  const avulso = !!(f.avulso && f.avulso.checked);

  // digitou o nome inteiro sem tocar na sugestão: vale, se houver um só paciente com esse nome
  if (!avulso && !pacienteId && f.querySelector('#busca-paciente-form')) {

async function salvarAgendamentoCel(id, pidFixo) {
  const f = document.getElementById('form-ag');
  const anterior = id ? G.raq_agendamentos.find((x) => x.id === id) : null;
  const pac = (id ? anterior.pacienteId : pidFixo) ? { avulso: false, pacienteId: id ? anterior.pacienteId : pidFixo, pacienteNomeAvulso: '' } : lerPacienteForm(f, null);
  if (!pac) return;
  const datas = lerDatas(f, [['data', 'Data da consulta', true]]); if (!datas) return;
  const horario = f.horario.value.trim();
  if (!horaValida(horario)) { avisar('Horário: digite hh:mm (ex.: 09:30).'); f.horario.focus(); return; }
  const dados = {
    id: id || ('ag_' + Date.now()), pacienteId: pac.pacienteId, pacienteNomeAvulso: pac.pacienteNomeAvulso,
    data: datas.data, horario, duracao: Number(f.duracao.value) || 60, local: f.local.value,
    endereco: f.local.value === 'Externo' ? f.endereco.value.trim() : '', status: f.status.value,
    consultaGeradaId: anterior ? anterior.consultaGeradaId || null : null, financeiroGeradoId: anterior ? anterior.financeiroGeradoId || null : null,
  };
  // horário já ocupado: só quando é novo ou mudou data, horário ou duração (mudar só o status não pergunta)
  const mudouHorario = !anterior || anterior.data !== dados.data || anterior.horario !== dados.horario || (Number(anterior.duracao) || 60) !== dados.duracao;
  const c = dados.status !== 'Cancelada' && mudouHorario ? conflitoNaAgenda(dados.data, dados.horario, dados.duracao, dados.id) : null;
  if (c) {
    const nomeOcupado = c.pacienteId ? nomePaciente(c.pacienteId) : `${c.pacienteNomeAvulso || '—'} (não cadastrado)`;
    if (!(await perguntar(`Este horário já está ocupado:\n\n${nomeOcupado} — ${dataBR(c.data)}, ${c.horario} (${Number(c.duracao) || 60} min)\n\nDeseja agendar assim mesmo?`, 'Agendar assim mesmo', 'Voltar'))) return;
  }
  await salvarRegistro('raq_agendamentos|' + dados.id, dados);
  formularioAlterado = false;
  avisar('Agendamento salvo com sucesso.');
  pilha.pop();
  if (!(await perguntarLancamentosDoAgendamentoCel(dados.id, anterior ? anterior.status : null))) desenhar();
}
// agendamento que acabou de virar "Concluída": duas perguntas; cria só o que tiver "Sim" e abre para preencher
async function perguntarLancamentosDoAgendamentoCel(agId, statusAnterior) {
  const ag = G.raq_agendamentos.find((x) => x.id === agId);
  if (!ag || ag.status !== 'Concluída' || statusAnterior === 'Concluída') return false;
  if (ag.consultaGeradaId || ag.financeiroGeradoId) return false;   // já gerado antes, evita duplicar
  if (!ag.pacienteId) return perguntarCadastroDoAvulsoCel(ag);
  const querConsulta = await perguntar('Agendamento concluído.\n\nDeseja fazer o lançamento da consulta?', 'Sim', 'Não');
  const querFinanceiro = await perguntar('Deseja fazer o lançamento financeiro?', 'Sim', 'Não');
  let consultaId = null, financeiroId = null;
  if (querConsulta) {
    const p = pacientes().find((x) => x.id === ag.pacienteId);
    consultaId = 'cons_' + Date.now();
    await salvarRegistro('raq_consultas|' + consultaId, { id: consultaId, pacienteId: ag.pacienteId, fase: faseAtual(p), agendamentoId: ag.id, data: ag.data, tratamento: '', evolucao: '', observacoes: '' });
  }
  if (querFinanceiro) financeiroId = await criarLancamentoFinanceiro(ag.pacienteId, ag.data, ag.id, consultaId);
  if (consultaId || financeiroId) await salvarRegistro('raq_agendamentos|' + ag.id, { ...ag, consultaGeradaId: consultaId, financeiroGeradoId: financeiroId });
  if (consultaId) { ir('formConsulta', consultaId, ag.pacienteId, financeiroId); return true; }
  if (financeiroId) { ir('formFinanceiro', financeiroId, null); return true; }
  return false;
}

      </div>

      ${id ? botaoExcluir(`excluirComPergunta('raq_financeiro|${esc(id)}', 'Tem certeza que deseja excluir este lançamento financeiro? Esta ação não pode ser desfeita.', 'Lançamento financeiro excluído.')`) : ''}
    </form>`;
  alternarNotaFin(document.getElementById('form-fin'));
};
// campos que aparecem conforme as respostas (alternarNotaFiscalFinanceiro)
function alternarNotaFin(f) {
  const pago = f.pagamento.value === 'Sim';
  const precisa = pago && f.precisaNota.value === 'Sim';
  const emitida = f.notaFiscal.value === 'Sim';
  document.getElementById('grp-fin-pago').style.display = pago ? '' : 'none';
  document.getElementById('grp-fin-precisa').style.display = pago ? '' : 'none';
  document.getElementById('grp-fin-solicitada').style.display = precisa ? '' : 'none';
  document.getElementById('grp-fin-emitida').style.display = emitida ? 'flex' : 'none';
}
async function salvarFinanceiroCel(id, pidFixo) {
  const f = document.getElementById('form-fin');
  const existente = id ? G.raq_financeiro.find((x) => x.id === id) : null;
  const fixo = id ? existente.pacienteId : pidFixo;
  const pac = fixo ? { avulso: false, pacienteId: fixo, pacienteNomeAvulso: '' } : lerPacienteForm(f, null);
  if (!pac) return;
  const pago = f.pagamento.value === 'Sim', emitida = f.notaFiscal.value === 'Sim', precisa = pago && f.precisaNota.value === 'Sim';
  const datas = lerDatas(f, [['data', 'Data da consulta', true], ...(pago ? [['dataPagamento', 'Data de pagamento', false]] : []),
    ...(precisa ? [['notaSolicitada', 'Solicitada ao contador em', false]] : []), ...(emitida ? [['notaData', 'Data de emissão', false]] : [])]);
  if (!datas) return;
  const dados = {
    id: id || ('fin_' + Date.now()), pacienteId: pac.pacienteId || null, pacienteNomeAvulso: pac.pacienteNomeAvulso,
    pacienteExcluido: (pac.avulso && existente) ? !!existente.pacienteExcluido : false,
    agendamentoId: existente ? existente.agendamentoId || null : null,
    data: datas.data, pagamento: f.pagamento.value, dataPagamento: pago ? datas.dataPagamento : '',
    valor: f.valor.value.trim(), tipoPagamento: f.tipoPagamento.value,
    precisaNota: pago ? f.precisaNota.value : 'Não', notaSolicitada: precisa ? datas.notaSolicitada : '',
    notaFiscal: f.notaFiscal.value, notaNumero: emitida ? f.notaNumero.value.trim() : '', notaData: emitida ? datas.notaData : '',
    observacoes: f.observacoes.value.trim(),
  };
  await salvarRegistro('raq_financeiro|' + dados.id, Object.assign({}, existente || {}, dados));   // mantém o vínculo com a consulta
  formularioAlterado = false;
  avisar('Lançamento financeiro salvo com sucesso.');
  pilha.pop();
  const recusouAgora = _cadastroAvulsoRecusado === dados.id; _cadastroAvulsoRecusado = null;
  if (pac.avulso && !dados.pacienteExcluido && !recusouAgora && await oferecerCadastroDoAvulso(pac.pacienteNomeAvulso, { financeiroId: dados.id, agendamentoId: dados.agendamentoId })) return;
  desenhar();
}

// ---------- Lembretes (como no notebook: adicionar, marcar feito, remover) ----------
TELAS.lembretes = () => {
  const hoje = hojeISO();
  const lista = G.raq_lembretes.slice().sort((a, b) => (!!a.feito !== !!b.feito) ? (a.feito ? 1 : -1) : ((a.data || '').localeCompare(b.data || '') || (a.hora || '').localeCompare(b.hora || '')));
  app.innerHTML = `${topo('Lembretes')}
    <form class="conteudo" id="form-lemb" onsubmit="event.preventDefault(); adicionarLembreteCel()">
      <div class="cartao form-cartao">
        ${campoForm('Novo lembrete', 'texto', '', 'text', 'autocomplete="off"')}
        <div class="dupla">${campoData('Data', 'data', '')}${campoHora('Horário', 'hora', '')}</div>
        <button class="btn" type="submit">Adicionar</button>
      </div>
      ${lista.length ? `<div class="cartao">${lista.map((l) => `<div class="linha-lemb${l.feito ? ' feito' : ''}">
          <input type="checkbox" ${l.feito ? 'checked' : ''} aria-label="Feito" onchange="alternarLembreteCel('${esc(l.id)}')">
          <span class="tx">${esc(l.texto)}<small style="color:${l.feito ? '#9db3ae' : (l.data === hoje ? 'var(--verde-medio)' : 'var(--texto-sec)')}">${esc(l.data ? dataBR(l.data) : '—')}${l.hora ? ' às ' + esc(l.hora) : ''}${l.data === hoje && !l.feito ? ' (hoje)' : ''}</small></span>
          <button class="btn perigo pequeno" type="button" onclick="removerLembreteCel('${esc(l.id)}')">Remover</button></div>`).join('')}</div>`
        : '<p class="vazio">Nenhum lembrete no momento.</p>'}
    </form>`;
};
async function adicionarLembreteCel() {
  const f = document.getElementById('form-lemb');
  const texto = f.texto.value.trim(); if (!texto) { f.texto.focus(); return; }
  const datas = lerDatas(f, [['data', 'Data', false]]); if (!datas) return;
  const hora = f.hora.value.trim();
  if (hora && !horaValida(hora)) { avisar('Horário: digite hh:mm (ex.: 09:30).'); f.hora.focus(); return; }
  const id = 'l_' + Date.now();
  await salvarRegistro('raq_lembretes|' + id, { id, texto, data: datas.data || hojeISO(), hora, feito: false, avisado: false });
  desenhar();
}
async function alternarLembreteCel(id) {
  const l = G.raq_lembretes.find((x) => x.id === id); if (!l) return;
  await salvarRegistro('raq_lembretes|' + id, { ...l, feito: !l.feito });
  desenhar();
}
async function removerLembreteCel(id) {
  if (!(await perguntar('Remover este lembrete?', 'Remover', 'Cancelar'))) return;
  await excluirRegistro('raq_lembretes|' + id);
  desenhar();
}

// ---------- Aniversariantes: do dia, da semana (7 dias) e do mês (30 dias), como no notebook ----------
let anivPeriodo = 'hoje';
TELAS.aniversariantes = () => {
  const h = new Date(); h.setHours(0, 0, 0, 0);
  const itens = [];
  pacientes().filter((p) => situacao(p) !== 'excluido' && p.nascimento).forEach((p) => {
    const [, m, d] = p.nascimento.split('-').map(Number);
    let prox = new Date(h.getFullYear(), m - 1, d); if (prox < h) prox = new Date(h.getFullYear() + 1, m - 1, d);
    const dif = Math.round((prox - h) / 86400000);
    if (dif <= { hoje: 0, semana: 7, mes: 30 }[anivPeriodo]) itens.push({ p, prox, dif });
  });
  itens.sort((a, b) => a.dif - b.dif || String(a.p.nome).localeCompare(String(b.p.nome), 'pt-BR'));
  const titulos = { hoje: 'Aniversariantes do dia', semana: 'Aniversariantes da semana', mes: 'Aniversariantes do mês' };
  app.innerHTML = `${topo('Aniversariantes')}
    <div class="conteudo">
      <div class="seg">${[['hoje', 'Hoje'], ['semana', 'Esta semana'], ['mes', 'Este mês']].map(([v, t]) => `<button class="${anivPeriodo === v ? 'ativo' : ''}" onclick="anivPeriodo='${v}'; desenhar()">${t}</button>`).join('')}</div>
      <div class="cab-lista"><b>${titulos[anivPeriodo]} (${itens.length})</b></div>
      ${itens.length ? `<div class="cartao">${itens.map(({ p, prox }) => `<div class="item-pac"><button class="abrir" onclick="ir('ficha','${esc(p.id)}')"><span class="n">${esc(p.nome)}</span>
          <span class="d">${anivPeriodo === 'hoje' ? esc(idade(p.nascimento)) : `${String(prox.getDate()).padStart(2, '0')}/${String(prox.getMonth() + 1).padStart(2, '0')} · ${esc(DIAS[prox.getDay()])}`}</span></button></div>`).join('')}</div>`
        : `<p class="vazio">${anivPeriodo === 'hoje' ? 'Nenhum paciente faz aniversário hoje.' : 'Nenhum aniversariante neste período.'}</p>`}
    </div>`;
};

TELAS.configuracoes = () => {
  app.innerHTML = `${topo('Configurações')}
    <div class="conteudo">
      <p class="grupo">Usuário</p>
      <div class="cartao dados"><div class="l"><span>Nome</span><span>${esc(usuario.nome || usuario.login)}</span></div><div class="l"><span>Usuário</span><span>${esc(usuario.login)}</span></div></div>
      <div id="bloco-bio" style="display:flex;flex-direction:column;gap:14px"><p class="grupo">Acesso</p>
      <div class="cartao dados"><div class="l" style="align-items:center"><span>Entrar com ${esc(nomeBio())}</span>
        <button class="seg-bio" id="chave-bio" onclick="alternarBio()"></button></div></div></div>
      <p class="grupo">Sincronização</p>
      <div class="cartao dados"><div class="l"><span>Última atualização</span><span>${esc(quandoCurto(estado.ultima))}</span></div></div>
      <button class="btn" onclick="atualizarComGoogle()">Atualizar agora</button>
      <p class="grupo">Sobre</p>
      <div class="cartao dados"><div class="l"><span>Versão</span><span>celular 0.9.2</span></div></div>
      <p style="font-size:12px;color:var(--texto-ter);margin:4px 2px">Usuários, backup, registro de atividades e licença ficam no notebook.</p>
      <button class="link" onclick="desligarCelular()">Tirar os dados deste celular</button>
    </div>`;
  mostrarChaveBio();
  bioDisponivel().then((sim) => { if (!sim) { const g = document.getElementById('bloco-bio'); if (g) g.remove(); } });
};
function mostrarChaveBio() {
  const c = document.getElementById('chave-bio'); if (!c) return;
  const ligado = !!lerBio()[usuario.login];
  c.textContent = ligado ? 'Ligado' : 'Desligado'; c.classList.toggle('ligado', ligado);
}
async function alternarBio() {
  const c = document.getElementById('chave-bio'); c.disabled = true;
  try {
    if (lerBio()[usuario.login]) { desligarBio(usuario.login); avisar(bioLigado(false)); }
    else { await ligarBio(usuario); avisar(bioLigado(true)); }
  } catch (e) { if (e.name !== 'NotAllowedError' && e.name !== 'AbortError') avisar('Não foi possível ligar ' + oBio() + '.' + motivoBio(e)); }
  c.disabled = false; mostrarChaveBio();
}
async function desligarCelular() {
  if (!confirm('Tirar os dados deste celular?\n\nNada é apagado no notebook nem no Google Drive. Para usar de novo, será preciso o código do cofre.')) return;
  await A.apagarTudo(); D.esquecer(); chave = null; estado = null; G = null; usuario = null;
  pilha = [['configurar', [1]]]; desenhar();
}

TELAS.embreve = (titulo) => {
  app.innerHTML = `${topo(titulo)}<div class="conteudo"><p class="vazio">Esta parte chega na próxima versão do celular.</p></div>`;
};

iniciar();
if ('serviceWorker' in navigator && !D.modoTeste) navigator.serviceWorker.register('sw.js').catch(() => {});
