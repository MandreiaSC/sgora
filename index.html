<!doctype html>
<html lang="pt-BR">
<head>
<!-- SGO_RA — Sistema de Gestão em Osteopatia. © 2026 Marcia Sales. Todos os direitos reservados (Lei 9.609/1998). -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f4c46">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SGO_RA">

<title>SGO_RA</title>
<style>
  :root{
    --verde:#0f4c46; --verde-escuro:#0b3733; --verde-medio:#1d7a6d; --verde-claro:#2f9e8f; --menta:#cdeae3; --menta-claro:#eaf6f3;
    --fundo:#f4f8f7; --borda:#d3e8e3; --texto:#1c2b29; --texto-sec:#5c7570; --texto-ter:#8a9c98; --sombra:0 2px 10px rgba(15,76,70,0.12);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; background:var(--fundo); color:var(--texto); font-family:'Segoe UI', -apple-system, Roboto, sans-serif; touch-action:manipulation;}
  body{min-height:100vh;}
  button{font-family:inherit;}
  a{color:var(--verde-medio);}
  .topo{background:var(--verde); color:#f2fbf9; padding:calc(env(safe-area-inset-top) + 16px) 14px 12px 4px; display:flex; align-items:center; gap:4px; position:sticky; top:0; z-index:5;}
  .topo .voltar{width:44px; height:44px; display:flex; align-items:center; justify-content:center; color:#f2fbf9; background:none; border:0;}
  .topo .titulo{flex:1; font-size:20px; font-weight:600; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .marca-topo{display:flex; flex-direction:column; align-items:center; gap:2px; flex:none;}
  .marca-topo img{width:34px; height:38px; object-fit:contain;}
  .marca-topo span{font-size:8.5px; font-weight:600; letter-spacing:.6px; color:#f2fbf9;}
  .marca-topo.grande img{width:46px; height:52px;}
  .marca-topo.grande span{font-size:9.5px;}
  .conteudo{padding:16px; display:flex; flex-direction:column; gap:14px; padding-bottom:calc(env(safe-area-inset-bottom) + 24px);}
  .cartao{background:#fff; border-radius:10px; box-shadow:var(--sombra);}
  .btn{min-height:48px; display:flex; align-items:center; justify-content:center; gap:8px; border-radius:10px; background:var(--verde); color:#fff; font-size:16px; font-weight:600; border:0; padding:0 16px; width:100%; cursor:pointer;}
  .btn.claro{background:#fff; color:var(--verde); border:1px solid var(--borda);}
  .btn.medio{background:var(--verde-claro);}
  .btn:disabled{opacity:.55;}
  .link{background:none; border:0; color:var(--texto-sec); font-size:15px; text-decoration:underline; min-height:40px; align-self:center; cursor:pointer;}
  .campo{display:flex; flex-direction:column; gap:6px; font-size:15px; font-weight:600; color:var(--texto-sec);}
  .campo input, .campo select{height:48px; border:1px solid var(--borda); border-radius:10px; padding:0 14px; font-size:17px; font-family:inherit; color:var(--texto); background:#fff; width:100%;}
  .aviso{font-size:14px; padding:10px 12px; border-radius:8px; background:var(--menta-claro); color:var(--verde-escuro); margin:0;}
  .aviso.erro{background:#fdf1f0; color:#a33025;}
  .vazio{text-align:center; color:var(--texto-ter); font-size:14px; padding:18px 8px;}
  .etiqueta{font-size:12px; font-weight:700; border-radius:999px; padding:3px 9px; white-space:nowrap;}
  /* entrada */
  .tela-entrada{min-height:100vh; background:var(--verde); display:flex; flex-direction:column; align-items:center; padding:calc(env(safe-area-inset-top) + 60px) 22px 30px;}
  .tela-entrada > img{width:70px; height:80px; object-fit:contain;}
  .tela-entrada .marca{margin:10px 0 26px; font-size:16px; font-weight:600; letter-spacing:1px; color:#f2fbf9;}
  .quadro-entrada{width:100%; max-width:420px; background:#fff; border-radius:14px; padding:26px 22px 20px; box-shadow:var(--sombra); display:flex; flex-direction:column; gap:14px;}
  .quadro-entrada h1{margin:0; font-size:22px; font-weight:700; color:var(--verde-escuro); text-align:center;}
  .quadro-entrada .sub{margin:2px 0 0; font-size:13px; font-weight:600; color:var(--texto-ter); text-align:center;}
  .rodape-entrada{margin:auto 0 0; padding-top:20px; font-size:13px; color:var(--menta); text-align:center;}
  .senha{position:relative; display:block;}
  .senha input{padding-right:48px;}
  .senha button{position:absolute; right:2px; top:2px; width:44px; height:44px; border:0; background:transparent; display:flex; align-items:center; justify-content:center;}
  .passos{display:flex; gap:6px; justify-content:center;}
  .passos span{width:28px; height:6px; border-radius:3px; background:var(--borda);}
  .passos span.feito{background:var(--verde-claro);}
  .barra{height:8px; border-radius:4px; background:var(--borda); overflow:hidden;} .barra div{height:100%; background:var(--verde-claro); width:0; transition:width .2s;}
  /* hoje */
  /* Hoje: ocupa exatamente a tela. A Agenda do dia cresce no espaço livre; com muitos agendamentos, rola por dentro
     e os botões ficam sempre à vista embaixo. Em tela muito baixa, a página toda rola. */
  .tela-hoje{height:100vh; height:100dvh; display:flex; flex-direction:column;}
  .tela-hoje .conteudo{flex:1; min-height:0; overflow-y:auto;}
  .tela-hoje .agenda-dia{flex:1 1 auto; min-height:170px; display:flex; flex-direction:column; overflow:hidden;}
  .lista-ag{flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;}
  .lista-ag .vazio{padding:28px 8px;}
  .cabeca-hoje{background:var(--verde); color:#f2fbf9; padding:calc(env(safe-area-inset-top) + 22px) 16px 18px; display:flex; align-items:center; gap:14px;}
  .avatar{width:52px; height:52px; border-radius:50%; border:2px solid var(--menta); background:var(--menta); color:var(--verde); font-weight:700; display:flex; align-items:center; justify-content:center; flex:none; overflow:hidden;}
  .avatar img{width:100%; height:100%; object-fit:cover;}
  .agenda-dia .faixa{background:var(--verde-claro); color:#fff; display:flex; align-items:center; gap:8px; padding:12px 14px; border-radius:10px 10px 0 0;}
  .agenda-dia .faixa b{flex:1; font-size:17px;}
  .contador{font-size:13px; font-weight:700; background:rgba(255,255,255,0.25); border-radius:999px; padding:2px 9px;}
  .linha-ag{display:flex; align-items:center; gap:12px; padding:13px 14px; font-size:16px; border-bottom:1px solid var(--borda); color:var(--texto); text-decoration:none; background:none; border-left:0; border-right:0; border-top:0; width:100%; text-align:left; font:inherit;}
  .linha-ag:last-child{border-bottom:0;}
  .linha-ag .hora{width:50px; font-size:16px; font-weight:700; color:var(--verde-medio);}
  .linha-ag .nome{flex:1; font-size:16px; min-width:0;}
  .dupla{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:12px;}
  .mini{border-radius:10px; padding:13px 14px; box-shadow:var(--sombra); min-width:0; min-height:96px;}
  .mini p{margin:0 0 6px; display:flex; align-items:center; gap:6px; font-size:15px; font-weight:700;}
  .mini ul{margin:0; padding-left:16px; font-size:14px; line-height:1.5;}
  .mini.lembretes{background:#fdf1f0; border-left:4px solid #c0392b;} .mini.lembretes p{color:#a33025;}
  .mini.aniversario{background:#fffbea; border-left:4px solid #e0a030;} .mini.aniversario p{color:#8a5a00;}
  .botoes-menu{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:12px; margin-top:auto; padding-top:4px;}
  .bt{min-height:88px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; border-radius:12px; background:var(--verde); color:#f2fbf9; font-size:16px; font-weight:600; border:0; box-shadow:var(--sombra); cursor:pointer;}
  .bt svg{width:28px; height:28px;}
  .bt.sair{grid-column:1 / -1; min-height:54px; flex-direction:row; background:#fff; color:var(--verde); border:1px solid var(--borda);}
  .bt.sair svg{width:24px; height:24px;}
  .situacao-sinc{margin:2px 0 0; min-height:36px; display:flex; align-items:center; justify-content:center; gap:6px; font-size:13px; color:var(--texto-sec); background:none; border:0; width:100%;}
  /* pacientes */
  .cab-lista{display:flex; justify-content:space-between; align-items:center; gap:8px;}
  .cab-lista b{font-size:15px; color:var(--verde-escuro);}
  .seg{display:flex; background:#fff; border:1px solid var(--borda); border-radius:10px; padding:3px; gap:3px;}
  .seg button{flex:1; min-height:38px; border:0; border-radius:8px; background:none; font-size:15px; font-weight:600; color:var(--texto-sec);}
  .seg button.ativo{background:var(--verde); color:#fff;}
  .ordem{background:none; border:0; font-size:13px; color:var(--texto-sec); min-height:36px;}
  .item-pac{display:flex; align-items:center; gap:10px; padding:10px 6px 10px 14px;}
  .item-pac button.abrir{flex:1; text-align:left; background:none; border:0; padding:0; color:var(--texto); font:inherit; min-width:0;}
  .item-pac .n{display:block; font-size:16px; font-weight:600;}
  .item-pac .d{display:block; font-size:13px; color:var(--texto-sec); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .olho{width:44px; height:44px; border:0; background:transparent; display:flex; align-items:center; justify-content:center; flex:none;}
  /* ficha */
  .faixa-pac{background:var(--menta-claro); border-bottom:1px solid var(--borda); padding:12px 16px;}
  .faixa-pac p{margin:0; font-size:15px; color:var(--verde-escuro);}
  .faixa-pac p + p{margin-top:2px;}
  .submenus{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:8px;}
  .sm{min-height:52px; display:flex; align-items:center; padding:0 14px; border-radius:10px; background:#e3f2ef; color:#3d5a55; font-size:16px; font-weight:600; border:0; text-align:left;}
  .sm.largo{grid-column:span 2; background:var(--menta); color:var(--verde);}
  .sm.breve{opacity:.55;}
  .dados{display:flex; flex-direction:column;}
  .dados .l{display:flex; justify-content:space-between; gap:12px; padding:10px 14px; border-bottom:1px solid var(--borda); font-size:15px;}
  .dados .l:last-child{border-bottom:0;}
  .dados .l span:first-child{color:var(--texto-sec); flex:none;}
  .dados .l span:last-child{text-align:right; font-weight:600; overflow-wrap:anywhere;}
  .grupo{font-size:13px; font-weight:700; color:var(--verde-medio); margin:6px 2px -4px;}
  .consulta{padding:12px 14px; display:flex; flex-direction:column; gap:4px;}
  .consulta .t{display:flex; justify-content:space-between; align-items:center;}
  .consulta .t b{font-size:15px; color:var(--verde-escuro);}
  .consulta .x{font-size:14px; color:var(--texto); white-space:pre-wrap; overflow-wrap:anywhere;}
  .consulta .x i{font-style:normal; color:var(--texto-sec); font-weight:600;}
  .ordem-data{align-self:flex-end;}
  /* folha de baixo (olhinho) */
  .veu{position:fixed; inset:0; background:rgba(11,55,51,.45); z-index:20; display:flex; align-items:flex-end;}
  .folha{background:#fff; width:100%; max-height:88vh; overflow:auto; border-radius:16px 16px 0 0; padding:16px 16px calc(env(safe-area-inset-bottom) + 18px);}
  .folha h2{margin:0 0 10px; font-size:18px; color:var(--verde-escuro);}
  .bloco-abrir summary{list-style:none; display:flex; flex-direction:column; gap:3px; padding:13px 40px 13px 14px; position:relative; cursor:pointer;}
  .bloco-abrir summary::-webkit-details-marker{display:none;}
  .bloco-abrir summary::after{content:''; position:absolute; right:16px; top:50%; width:9px; height:9px; border-right:2px solid var(--verde-medio); border-bottom:2px solid var(--verde-medio); transform:translateY(-70%) rotate(45deg); transition:transform .15s;}
  .bloco-abrir[open] summary::after{transform:translateY(-30%) rotate(-135deg);}
  .bloco-abrir .ba-t{font-size:16px; font-weight:700; color:var(--verde-escuro);}
  .bloco-abrir .ba-r{font-size:13px; color:var(--texto-sec); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .bloco-abrir[open] .ba-r{display:none;}
  .bloco-abrir .dados{border-top:1px solid var(--borda);}
  .obs{font-size:13px; font-style:italic; color:var(--texto-ter); font-weight:400 !important;}
  .rot-tab{margin:12px 14px 6px; font-size:14px; font-weight:700; color:var(--verde-medio);}
  .tab-neural{width:calc(100% - 28px); margin:0 14px 12px; border-collapse:collapse; font-size:14px; table-layout:fixed;}
  .tab-neural th, .tab-neural td{border:1px solid var(--borda); text-align:center; height:36px; padding:0 2px;}
  .tab-neural th{background:var(--menta-claro); color:var(--verde-escuro); font-weight:700;}
  .tab-neural th:first-child{background:none; border:0; width:34%;}
  .tab-neural td.rot{text-align:left; padding-left:8px; color:var(--texto-sec); font-size:13px;}
  .cadeia-figs{display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:12px 14px 4px;}
  .fig{display:flex; flex-direction:column; align-items:center; gap:4px; background:none; border:0; padding:0; font:inherit; color:var(--verde-escuro); font-size:13px; font-weight:700;}
  .fig svg{width:100%; height:auto; display:block;}
  .fig.desenho{grid-column:1 / -1;}
  .img-desenho{width:100%; max-width:320px; aspect-ratio:1; background:#fff; border:1px solid var(--borda); border-radius:10px; display:block; margin:0 auto;}
  .sem-desenho{display:block; padding:18px; color:var(--texto-ter); font-weight:400; font-size:13px;}
  .dica-ampliar{margin:0 14px 6px; font-size:12px; color:var(--texto-ter); text-align:center;}
  .veu-cheio{align-items:stretch;}
  .folha-cheia{max-height:100vh; height:100%; border-radius:0; padding-top:calc(env(safe-area-inset-top) + 14px);}
  .ampliado svg, .ampliado .img-desenho{width:100%; max-width:none; height:auto;}
  .campo-filtro{font-size:14px;}
  .campo-filtro input, .campo-filtro select{height:46px; font-size:16px;}
  .dia-ag{padding:10px 14px; font-size:15px; font-weight:700; color:var(--verde-escuro); background:var(--menta-claro); border-radius:10px 10px 0 0; border-bottom:1px solid var(--borda);}
  .dia-ag span{font-weight:400; color:var(--texto-sec); font-size:13px;}
  .linha-ag .det{display:block; font-size:12px; color:var(--texto-sec);}
  .linha-ag .data-ag{width:88px; font-size:15px; font-weight:700; color:var(--verde-medio); display:flex; flex-direction:column;}
  .linha-ag .data-ag small{font-weight:400; color:var(--texto-sec); font-size:12px;}
  .avulso{font-size:12px; color:#8a5a00;}
  #lista-fin .item-pac, .cartao > .item-pac{border-bottom:1px solid var(--borda);}
  #lista-fin .item-pac:last-child, .cartao > .item-pac:last-child{border-bottom:0;}
  .doc-avulso{width:100%; height:75vh; border:1px solid var(--borda); border-radius:8px; background:#fff;}
  .totais{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:8px;}
  .totais div{background:#fff; border-radius:10px; box-shadow:var(--sombra); padding:10px 12px; font-size:13px; color:var(--texto-sec);}
  .totais b{display:block; font-size:17px; color:var(--verde-escuro);}
  .form-cartao{padding:14px; display:flex; flex-direction:column; gap:12px;}
  .campo-form{font-size:14px;}
  .campo-form input, .campo-form select{height:48px; font-size:16px;}
  .principal{color:var(--verde-claro); font-weight:900;}
  .idade-form{margin:-4px 2px 0; font-size:14px; color:var(--texto-sec);}
  .legenda-principal{margin:0 2px; font-size:13px; color:var(--texto-sec);}
  .seg-bio{min-width:104px; min-height:38px; border-radius:999px; border:1px solid var(--borda); background:#eef2f1; color:var(--texto-sec); font-size:14px; font-weight:700; flex:none;}
  .seg-bio.ligado{background:var(--verde-claro); border-color:var(--verde-claro); color:#fff;}
  .aviso-flutuante{position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 24px); transform:translateX(-50%); background:var(--verde-escuro); color:#fff; padding:10px 16px; border-radius:10px; font-size:14px; z-index:30; max-width:90vw; text-align:center;}
</style>
</head>

<script>
'use strict';
// ====================== estado ======================
const N = window.SgoNucleo, A = window.SgoArmazem, D = window.SgoDrive;
let chave = null, estado = null, G = null, usuario = null, pilha = [];
const FUNCOES_COM_CELULAR = ['super-admin', 'admin'];
const app = document.getElementById('app');

const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ICONE = {

  pacientes: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7"/><path d="M18 14.5a6.5 6.5 0 0 1 3.5 5.5"/></svg>',

  config: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3"/><path d="M12 18.5v3"/><path d="M2.5 12h3"/><path d="M18.5 12h3"/><path d="M5.3 5.3l2.1 2.1"/><path d="M16.6 16.6l2.1 2.1"/><path d="M5.3 18.7l2.1-2.1"/><path d="M16.6 7.4l2.1-2.1"/></svg>',
  sair: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h5v16h-5"/><path d="M10 8l-4 4 4 4"/><path d="M6 12h10"/></svg>',
  mais: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>',
  rosto: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V6a2 2 0 0 1 2-2h2"/><path d="M16 4h2a2 2 0 0 1 2 2v2"/><path d="M20 16v2a2 2 0 0 1-2 2h-2"/><path d="M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M9 9.5v1"/><path d="M15 9.5v1"/><path d="M12 9.5v4h-1"/><path d="M9.5 16a3.5 3.5 0 0 0 5 0"/></svg>',
  nuvem: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2f9e8f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19a4.5 4.5 0 1 0-1.4-8.8A6 6 0 0 0 4.3 12.5 3.5 3.5 0 0 0 6.5 19z"/><path d="M9.5 14.5l2 2 3.5-3.5"/></svg>',
};

// ====================== datas ======================
const DIAS = ['domingo', 'segunda-feira', 'terça-feira', 'quarta-feira', 'quinta-feira', 'sexta-feira', 'sábado'];
const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const hojeISO = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const dataBR = (iso) => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso || '')); return m ? `${m[3]}/${m[2]}/${m[1]}` : ''; };
function idade(nasc) {
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(nasc || '')); if (!m) return '';
  const h = new Date(); let a = h.getFullYear() - Number(m[1]);
  if (h.getMonth() + 1 < Number(m[2]) || (h.getMonth() + 1 === Number(m[2]) && h.getDate() < Number(m[3]))) a--;
  return a >= 0 ? a + ' anos' : '';
}
function saudacao() { const h = new Date().getHours(); return h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite'; }
function dataPorExtenso() { const d = new Date(); const s = DIAS[d.getDay()]; return `${s[0].toUpperCase()}${s.slice(1)}, ${d.getDate()} de ${MESES[d.getMonth()]} de ${d.getFullYear()}`; }
function quandoCurto(iso) {
  if (!iso) return '—'; const d = new Date(iso); if (isNaN(d)) return '—';
  const hora = d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  const ontem = new Date(); ontem.setDate(ontem.getDate() - 1);
  if (d.toDateString() === new Date().toDateString()) return 'hoje, ' + hora;
  if (d.toDateString() === ontem.toDateString()) return 'ontem, ' + hora;
  return d.toLocaleDateString('pt-BR') + ', ' + hora;
}

// período (mesmo do notebook: semana de domingo a sábado)
function intervaloPeriodo(periodo, ini, fim) {
  const h = new Date(); h.setHours(0, 0, 0, 0); const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  if (periodo === 'hoje') return [iso(h), iso(h)];
  if (periodo === 'semana') { const i = new Date(h); i.setDate(i.getDate() - i.getDay()); const f = new Date(i); f.setDate(f.getDate() + 6); return [iso(i), iso(f)]; }
  if (periodo === 'mes') return [iso(new Date(h.getFullYear(), h.getMonth(), 1)), iso(new Date(h.getFullYear(), h.getMonth() + 1, 0))];
  if (periodo === 'ano') return [`${h.getFullYear()}-01-01`, `${h.getFullYear()}-12-31`];
  return [ini || '', fim || ''];
}

// ====================== Face ID / digital (chave de acesso do próprio aparelho) ======================
// Nada sai do celular: o aparelho confere o rosto ou a digital e libera a entrada. A senha continua valendo.
// Se a senha mudar no notebook, o Face ID deste usuário se desliga e é preciso entrar uma vez com a senha nova.
const BIO = 'sgora_bio', BIO_PERGUNTADO = 'sgora_bio_perguntado', ULTIMO_LOGIN = 'sgora_ultimo_login';
const ehIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const nomeBio = () => ehIOS ? 'Face ID' : 'biometria';
const oBio = () => ehIOS ? 'o Face ID' : 'a biometria';
const bioLigado = (sim) => ehIOS ? (sim ? 'Face ID ligado.' : 'Face ID desligado.') : (sim ? 'Biometria ligada.' : 'Biometria desligada.');
const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
const deB64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
function lerBio() { try { return JSON.parse(localStorage.getItem(BIO) || '{}') || {}; } catch (e) { return {}; } }
function gravarBio(v) { try { localStorage.setItem(BIO, JSON.stringify(v)); } catch (e) { /* nada */ } }
// No iPhone, o app da Tela de Início às vezes responde "não disponível" mesmo com o Face ID ligado:
// lá, tenta assim mesmo (se falhar, o aviso mostra o motivo).
async function bioDisponivel() {
  if (!window.PublicKeyCredential || !navigator.credentials) return false;
  try { if (await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()) return true; } catch (e) { /* segue */ }
  return ehIOS;
}
const motivoBio = (e) => e && e.name ? ` (${e.name}${e.message ? ': ' + String(e.message).slice(0, 80) : ''})` : '';
// "Impressão" da senha atual (curta, não serve para descobrir a senha): muda quando a senha muda no notebook
async function marcaSenha(u) {
  const h = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('sgora-bio|' + u.salt + '|' + u.senhaHash));
  return b64(h).slice(0, 12);
}
async function ligarBio(u) {
  const cred = await navigator.credentials.create({ publicKey: {
    challenge: crypto.getRandomValues(new Uint8Array(32)),
    rp: { name: 'SGO_RA' },
    user: { id: new TextEncoder().encode(String(u.id)), name: u.login, displayName: u.nome || u.login },
    pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
    authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'discouraged' },
    attestation: 'none', timeout: 60000 } });
  const b = lerBio(); b[u.login] = { id: b64(cred.rawId), marca: await marcaSenha(u) }; gravarBio(b);
}
function desligarBio(login) { const b = lerBio(); delete b[login]; gravarBio(b); }
async function entrarComBio() {
  const b = lerBio(); const logins = Object.keys(b); if (!logins.length) return;
  const botao = document.getElementById('btn-bio'); if (botao) botao.disabled = true;
  let cred;
  try {
    cred = await navigator.credentials.get({ publicKey: { challenge: crypto.getRandomValues(new Uint8Array(32)),
      allowCredentials: logins.map((l) => ({ type: 'public-key', id: deB64(b[l].id) })), userVerification: 'required', timeout: 60000 } });
  } catch (e) { if (botao) botao.disabled = false; if (e.name !== 'NotAllowedError' && e.name !== 'AbortError') avisar('Não foi possível usar ' + oBio() + '. Entre com a senha.' + motivoBio(e)); return; }
  const idUsado = b64(cred.rawId);
  const login = logins.find((l) => b[l].id === idUsado);
  const u = login && G.raq_usuarios.find((x) => String(x.login || '').toLowerCase() === login.toLowerCase());
  if (!u) { if (login) desligarBio(login); TELAS.entrar('Usuário não encontrado. Entre com a senha.'); return; }
  if (b[login].marca !== await marcaSenha(u)) {
    desligarBio(login);
    try { localStorage.setItem(BIO_PERGUNTADO, JSON.stringify(JSON.parse(localStorage.getItem(BIO_PERGUNTADO) || '[]').filter((l) => l !== login))); } catch (e) { /* nada */ }
    TELAS.entrar('A senha mudou no notebook. Entre com a senha nova para usar ' + oBio() + ' de novo.'); return;
  }
  if (!podeEntrar(u)) return;
  await concluirEntrada(u);
}
// Pergunta só na primeira entrada com senha deste usuário neste celular
async function oferecerBio(u) {
  let perguntados = []; try { perguntados = JSON.parse(localStorage.getItem(BIO_PERGUNTADO) || '[]'); } catch (e) { perguntados = []; }
  if (lerBio()[u.login] || perguntados.includes(u.login) || !(await bioDisponivel())) return;
  perguntados.push(u.login); try { localStorage.setItem(BIO_PERGUNTADO, JSON.stringify(perguntados)); } catch (e) { /* nada */ }
  abrirFolha(`<h2>Usar ${esc(oBio())} para entrar?</h2>
    <p style="margin:0 0 14px;font-size:15px;color:var(--texto-sec)">Na próxima vez, você entra sem digitar a senha. A senha continua valendo. Você pode mudar isso em Configurações.</p>
    <button class="btn" id="btn-ligar-bio" onclick="ligarBioDaFolha(this)">${ICONE.rosto}Usar ${esc(oBio())}</button>`, 'Agora não');
}
async function ligarBioDaFolha(botao) {
  botao.disabled = true;
  try { await ligarBio(usuario); botao.closest('.veu').remove(); avisar(bioLigado(true)); }
  catch (e) { botao.disabled = false; if (e.name !== 'NotAllowedError' && e.name !== 'AbortError') avisar('Não foi possível ligar ' + oBio() + '.' + motivoBio(e)); }
}

// ====================== atualizar (trazer novidades do notebook) ======================
let atualizando = false, situacaoSinc = { erro: null };
async function atualizar(silencioso) {
  if (atualizando || !chave) return;
  if (!D.temPasse()) { situacaoSinc = { erro: 'SEM_PASSE' }; redesenharSituacao(); return; }
  atualizando = true; redesenharSituacao();
  try {
    const r = await N.lerNovidades(chave, D.transporte, estado);
    reconciliarPendentes();
    const enviadas = await enviarPendentes();
    estado.ultima = new Date().toISOString();

    situacaoSinc = { erro: null };
    if (r.recebidas) { G = N.montarGavetas(estado); const u = G.raq_usuarios.find((x) => x.id === usuario.id); if (u) usuario = u; if (!document.querySelector('.veu') && !formularioAlterado) desenhar(); }
    if (!silencioso) avisar(r.recebidas ? 'Dados atualizados.' : enviadas ? 'Alterações enviadas ao notebook.' : 'Tudo em dia.');
  } catch (e) {

    if (!silencioso) avisar(e.code === 'SEM_INTERNET' ? 'Sem internet. Tente mais tarde.' : e.message);
  } finally { atualizando = false; redesenharSituacao(); }

// ====================== gravar no celular e enviar ao notebook ======================
// Toda alteração feita aqui: (1) vale na hora no celular; (2) fica guardada (criptografada) como "pendente";
// (3) vai para o Google Drive num lote — na hora, se houver internet, ou na próxima atualização.
let formularioAlterado = false;
async function salvarRegistro(k, valorNovo) {
  const em = new Date().toISOString();
  const v = { ...valorNovo, [N.CAMPO_CARIMBO]: em };
  const atual = estado.registros.get(k);
  const pend = estado.pendentes.get(k);
  estado.pendentes.set(k, { v, em, base: pend ? pend.base : (atual && atual.v) || null });
  estado.registros.set(k, { v, em });
  G = N.montarGavetas(estado);
  await A.gravarEstado(chave, estado);
  enviarPendentes().then((n) => { if (n) A.gravarEstado(chave, estado); redesenharSituacao(); }).catch(() => redesenharSituacao());
  return v;
}
// chegou de outro aparelho uma versão mais nova de um registro que o celular também mudou: junta campo a campo
function reconciliarPendentes() {
  for (const [k, p] of estado.pendentes) {
    const r = estado.registros.get(k);
    if (!r || r.em === p.em) continue;
    const em = new Date().toISOString();
    const v = { ...N.juntarComRemoto(p.v, p.base, r.v), [N.CAMPO_CARIMBO]: em };
    estado.pendentes.set(k, { v, em, base: r.v });
    estado.registros.set(k, { v, em });
  }
  G = N.montarGavetas(estado);
}
let enviando = null;
async function enviarPendentes() {
  if (!estado.pendentes.size || !D.temPasse()) return 0;
  if (enviando) return enviando;
  enviando = (async () => {
    const lista = [...estado.pendentes].map(([k, p]) => ({ k, v: p.v, em: p.em }));
    const nome = await N.enviarLote(chave, D.transporte, estado.aparelho, lista);
    estado.aplicados.add(nome);
    for (const m of lista) { const p = estado.pendentes.get(m.k); if (p && p.em === m.em) estado.pendentes.delete(m.k); }
    return lista.length;
  })();
  try { return await enviando; } finally { enviando = null; }
}

}

// CEP completo → preenche Logradouro, Bairro, Cidade e Estado vazios (ViaCEP, como no notebook; só o CEP sai do celular)
let cepBuscado = '';
function buscarCep(el) {
  const cep = el.value.replace(/\D/g, '');
  if (cep.length !== 8) { cepBuscado = ''; return; }
  if (cep === cepBuscado) return;
  cepBuscado = cep;
  fetch('https://viacep.com.br/ws/' + cep + '/json/').then((r) => r.ok ? r.json() : null).then((d) => {
    if (!d || d.erro || el.value.replace(/\D/g, '') !== cep) return;
    const f = el.form; let preencheu = false;
    for (const [nome, valor] of [['logradouro', d.logradouro], ['bairro', d.bairro], ['cidade', d.localidade], ['estado', d.uf]]) {
      if (f[nome] && !f[nome].value.trim() && valor) { f[nome].value = nome === 'estado' ? String(valor).toUpperCase() : valor; preencheu = true; }
    }
    if (preencheu) { formularioAlterado = true; avisar('Endereço preenchido pelo CEP.'); }
  }).catch(() => {});
}

    naturalidade: val('naturalidade'), estadoCivil: f.estadoCivil.value, escolaridade: f.escolaridade.value, profissao: val('profissao'),
    identidade: val('identidade'), cpf: val('cpf'), telefone: val('telefone'), celular: val('celular'), email: val('email'),
    logradouro: val('logradouro'), bairro: val('bairro'), cidade: val('cidade'), estado: val('estado').toUpperCase(), cep: val('cep'),

// Figura da cadeia lesional com as marcações. Igual ao notebook: caixa 480×1142 (a imagem estica na caixa),
// coordenadas em % da caixa, raio do círculo em % da largura.
const CAIXA_W = 480, CAIXA_H = 1142;
function figuraCadeia(lado, marcas) {
  const X = (p) => p * CAIXA_W / 100, Y = (p) => p * CAIXA_H / 100;
  const seta = (x1, y1, x2, y2) => {
    const esp = 5, ang = Math.atan2(y2 - y1, x2 - x1), cab = esp * 4.2;
    const p1 = [x2 - cab * Math.cos(ang - 0.45), y2 - cab * Math.sin(ang - 0.45)], p2 = [x2 - cab * Math.cos(ang + 0.45), y2 - cab * Math.sin(ang + 0.45)];
    const bx = x2 - cab * 0.8 * Math.cos(ang), by = y2 - cab * 0.8 * Math.sin(ang);
    return `<line x1="${x1}" y1="${y1}" x2="${bx}" y2="${by}" stroke="#c0392b" stroke-width="${esp}" stroke-linecap="round"/><polygon points="${x2},${y2} ${p1[0]},${p1[1]} ${p2[0]},${p2[1]}" fill="#c0392b"/>`;
  };
  const desenho = (marcas || []).map((m) => {
    const tipo = m.tipo || 'ponto';
    if (tipo === 'ponto') return `<circle cx="${X(m.x)}" cy="${Y(m.y)}" r="11" fill="#c0392b" stroke="#fff" stroke-width="3"/>`;
    if (tipo === 'circulo') return `<circle cx="${X(m.x)}" cy="${Y(m.y)}" r="${X(m.r)}" fill="none" stroke="#c0392b" stroke-width="5"/>`;
    return seta(X(m.x1), Y(m.y1), X(m.x2), Y(m.y2));
  }).join('');
  return `<svg class="fig-cadeia" viewBox="0 0 ${CAIXA_W} ${CAIXA_H}" role="img" aria-label="${lado === 'frente' ? 'Frente' : 'Costas'}">
    <rect width="${CAIXA_W}" height="${CAIXA_H}" rx="20" fill="#cdeae3"/>
    <image href="cadeia_${lado}.png" width="${CAIXA_W}" height="${CAIXA_H}" preserveAspectRatio="none"/>${desenho}</svg>`;
}

      <div class="cab-lista"><b id="titulo-lista"></b><button class="ordem" onclick="filtroFin.desc=!filtroFin.desc; listarFinanceiro()" id="btn-ordem"></button></div>
      <div id="lista-fin" class="cartao"></div>
    </div>`;
  listarFinanceiro();
};
// totais: com filtro de pagamento, só o da situação escolhida; sem filtro, recebido e pendente (+ abonado, se houver)
function totaisHtml(lista, filtroPagamento) {
  let rec = 0, pen = 0, abo = 0;
  lista.forEach((f) => { const v = valorReal(f.valor), s = situacaoPag(f); if (s === 'pago') rec += v; else if (s === 'abonado') abo += v; else pen += v; });
  const so = { Sim: 'pago', 'Não': 'pendente', Abonado: 'abonado' }[filtroPagamento];
  const it = (n, v) => `<div>${n}<b>${v}</b></div>`;
  const partes = [it('Lançamentos', lista.length)];
  if (!so || so === 'pago') partes.push(it('Recebido', real(rec)));
  if (!so || so === 'pendente') partes.push(it('Pendente', real(pen)));
  if (so === 'abonado' || (!so && abo)) partes.push(it('Abonado', real(abo)));
  return lista.length ? partes.join('') : '';
}
function listarFinanceiro() {
  const termo = filtroFin.busca.trim().toLowerCase();
  const per = intervaloPeriodo(filtroFin.periodo, filtroFin.ini, filtroFin.fim);
  let lista = G.raq_financeiro.filter((f) => noPeriodo(f.data, per) && (filtroFin.pagamento === 'todos' || f.pagamento === filtroFin.pagamento) && (filtroFin.nota === 'todos' || f.notaFiscal === filtroFin.nota));
  if (termo) lista = lista.filter((f) => nomeDoRegistro(f).toLowerCase().includes(termo));
  lista.sort((a, b) => String(a.data || '').localeCompare(String(b.data || '')) * (filtroFin.desc ? -1 : 1));
  document.getElementById('totais-fin').innerHTML = totaisHtml(lista, filtroFin.pagamento);
  document.getElementById('titulo-lista').textContent = `${lista.length} ${lista.length === 1 ? 'lançamento' : 'lançamentos'}`;
  document.getElementById('btn-ordem').textContent = filtroFin.desc ? 'Data ▼ mais recentes' : 'Data ▲ mais antigas';
  const caixa = document.getElementById('lista-fin');
  caixa.style.display = lista.length ? '' : 'none';
  caixa.innerHTML = lista.map((f) => linhaLancamento(f, true)).join('');
  const v = document.getElementById('fin-vazio'); if (v) v.remove();
  if (!lista.length) caixa.insertAdjacentHTML('afterend', '<p class="vazio" id="fin-vazio">Nenhum lançamento encontrado para os filtros selecionados.</p>');
}
function linhaLancamento(f, comNome) {
  return `<div class="item-pac"><button class="abrir" onclick="verLancamento('${esc(f.id)}')">
      ${comNome ? `<span class="n">${esc(nomeDoRegistro(f))}${marcaAvulso(f)}</span>` : ''}
      <span class="${comNome ? 'd' : 'n'}">${esc(dataBR(f.data))} · ${esc(f.valor || '—')}</span></button>
    ${etiquetaPag(f)}<button class="olho" aria-label="Visualizar" onclick="verLancamento('${esc(f.id)}')">${ICONE.olho}</button></div>`;
}
// olhinho: os mesmos campos do notebook (_conteudoLancamento), só os que valem
function verLancamento(id) {
  const f = G.raq_financeiro.find((x) => x.id === id); if (!f) return;
  const pago = f.pagamento === 'Sim';
  const itens = [['Data da consulta', dataBR(f.data)], ['Valor da consulta', f.valor], ['Tipo de pagamento', f.tipoPagamento], ['Pagamento', f.pagamento]];
  if (pago) itens.push(['Data de pagamento', dataBR(f.dataPagamento)], ['Precisa de nota fiscal?', f.precisaNota || 'Não']);
  if (pago && f.precisaNota === 'Sim') itens.push(['Solicitada ao contador em:', dataBR(f.notaSolicitada)]);
  itens.push(['Nota fiscal emitida?', f.notaFiscal || 'Não']);
  if (f.notaFiscal === 'Sim') itens.push(['Número da nota', f.notaNumero], ['Data de emissão', dataBR(f.notaData)]);
  abrirFolha(`<h2>Lançamento de ${esc(dataBR(f.data))}</h2><p style="margin:0 0 10px;font-weight:700;color:var(--verde-escuro)">${esc(nomeDoRegistro(f))}${marcaAvulso(f)}</p>
    <div class="cartao dados">${linhasDados(itens)}<div class="l" style="flex-direction:column;gap:4px"><span>Observações</span><span style="white-space:pre-wrap;text-align:left;color:var(--texto);font-weight:400">${esc(valor(f.observacoes))}</span></div></div>`);
}

// ---------- Arquivos anexados (consulta) — lista como no notebook (renderizarArquivosPaciente) ----------
// O conteúdo de cada arquivo fica numa "gaveta" própria no Drive e só é baixado quando a pessoa toca nele.
const tamanhoArquivo = (b) => !b ? '' : b < 1024 ? b + ' B' : b < 1024 * 1024 ? (b / 1024).toFixed(0) + ' KB' : (b / (1024 * 1024)).toFixed(1) + ' MB';
const ehOffice = (nome) => /\.(docx?|xlsx?|pptx?)$/i.test(nome || '');
function tipoArquivo(a) { return a.htmlDoc ? 'documento' : a.tipo === 'application/pdf' ? 'pdf' : (a.tipo || '').startsWith('image/') ? 'imagem' : ehOffice(a.nomeOriginal) ? 'office' : 'outro'; }
const ICONE_ARQ = {

  doc: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1d7a6d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="15" y2="17"/></svg>',
};
TELAS.arquivos = (id) => {

          <button class="abrir" onclick="abrirArquivo('${esc(id)}','${esc(a.id)}')"><span class="n">${esc(a.nome || a.nomeOriginal || 'Arquivo')}</span>

// Aparência dos documentos avulsos (CSS + fundos, logo e assinatura): o notebook manda criptografado; o celular
// guarda (também criptografado) e só baixa de novo quando o notebook mandar uma versão nova.
let _recDocs = null;
async function recursosDocumentos() {
  if (_recDocs) return _recDocs;
  let guardado = null;
  try { const t = await A.lerTexto(chave, 'documentos'); if (t) guardado = JSON.parse(t); } catch (e) { guardado = null; }
  try {
    if (D.temPasse()) {
      const r = await N.lerRecurso(chave, D.transporte, 'documentos', guardado && guardado.nome);
      if (r && r.conteudo) { guardado = { nome: r.nome, rec: JSON.parse(r.conteudo) }; await A.gravarTexto(chave, 'documentos', JSON.stringify(guardado)); }
    }
  } catch (e) { /* sem internet: usa o que está guardado */ }
  _recDocs = guardado ? guardado.rec : null;
  return _recDocs;
}
// igual ao _montarDocumentoHtmlCompleto do notebook
function montarDocumentoCompleto(compacto, titulo, rec, zoom) {
  const corpo = String(compacto).replace(/\{\{B64:([A-Z_0-9]+)\}\}/g, (m, n) => (rec.imagens || {})[n] || '');
  return `<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>${esc(titulo)}</title><style>${rec.css || ''}
html,body{margin:0; padding:0; background:#6f7f7b;}
html{zoom:${zoom}}
.folha-impressao{display:block !important; position:relative !important; left:auto !important; top:auto !important; margin:14px auto !important; box-shadow:0 2px 12px rgba(0,0,0,.35);}
</style></head><body>${corpo}</body></html>`;
}
function dataUrlParaBlob(d) {
  const m = /^data:([^;,]*)(;base64)?,(.*)$/s.exec(d || ''); if (!m) return null;
  const bin = m[2] ? atob(m[3]) : decodeURIComponent(m[3]); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return new Blob([u], { type: m[1] || 'application/octet-stream' });
}
async function abrirArquivo(pid, aid) {
  const a = ((G.raq_arquivos_pacientes || {})[pid] || []).find((x) => x.id === aid); if (!a) return;
  const tipo = tipoArquivo(a);
  const campo = tipo === 'documento' ? 'htmlDoc' : 'dados';
  let conteudo = a[campo] && a[campo] !== '@cofre' ? a[campo] : null;
  if (!conteudo) {
    if (!D.temPasse()) { try { await D.entrar(); } catch (e) { if (e.message !== 'CANCELADO') avisar(e.message); return; } }
    avisar('Abrindo o arquivo...');
    try { conteudo = await N.lerAnexo(chave, D.transporte, a.id, campo); }
    catch (e) { avisar(e.code === 'SEM_INTERNET' ? 'Sem internet. Para abrir o arquivo, conecte-se à internet.' : 'Não foi possível abrir o arquivo.'); return; }
    if (!conteudo) { avisar('O arquivo ainda não chegou ao Google Drive. Tente mais tarde.'); return; }
  }
  const nome = a.nome || a.nomeOriginal || 'Arquivo';
  if (tipo === 'imagem') { ampliar(`<img src="${esc(conteudo)}" alt="" style="width:100%;height:auto;display:block;border-radius:8px">`, nome); return; }
  if (tipo === 'documento') {
    const rec = await recursosDocumentos();
    if (!rec) { avisar('A aparência dos documentos ainda não chegou do notebook. Abra o SGO_RA no notebook com internet e tente de novo.'); return; }
    const zoom = Math.min(1, (window.innerWidth - 48) / 830).toFixed(3);
    ampliar(`<iframe class="doc-avulso" sandbox="" srcdoc="${esc(montarDocumentoCompleto(conteudo, nome, rec, zoom))}"></iframe>`, nome); return;
  }
  // PDF, Word, Excel...: o próprio celular abre (menu de compartilhar → abrir no app certo)
  const blob = dataUrlParaBlob(conteudo); if (!blob) { avisar('Não foi possível abrir o arquivo.'); return; }
  const arquivo = new File([blob], a.nomeOriginal || nome, { type: blob.type });
  if (navigator.canShare && navigator.canShare({ files: [arquivo] })) {
    try { await navigator.share({ files: [arquivo], title: nome }); } catch (e) { /* cancelou */ }
    return;
  }
  const url = URL.createObjectURL(blob); const l = document.createElement('a'); l.href = url; l.download = arquivo.name; document.body.appendChild(l); l.click(); l.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

let consultasDesc = true;

          ${c.tratamento ? `<div class="x"><i>Tratamento:</i> ${esc(c.tratamento)}</div>` : ''}${c.evolucao ? `<div class="x"><i>Evolução:</i> ${esc(c.evolucao)}</div>` : ''}</div>`).join('')
        : '<p class="vazio">Nenhuma consulta.</p>'}

};

  mostrarChaveBio();

function mostrarChaveBio() {
  const c = document.getElementById('chave-bio'); if (!c) return;
  const ligado = !!lerBio()[usuario.login];
  c.textContent = ligado ? 'Ligado' : 'Desligado'; c.classList.toggle('ligado', ligado);
}
async function alternarBio() {
  const c = document.getElementById('chave-bio'); c.disabled = true;
  try {
    if (lerBio()[usuario.login]) { desligarBio(usuario.login); avisar(bioLigado(false)); }
    else { await ligarBio(usuario); avisar(bioLigado(true)); }
  } catch (e) { if (e.name !== 'NotAllowedError' && e.name !== 'AbortError') avisar('Não foi possível ligar ' + oBio() + '.' + motivoBio(e)); }
  c.disabled = false; mostrarChaveBio();
}
async function desligarCelular() {
  if (!confirm('Tirar os dados deste celular?\n\nNada é apagado no notebook nem no Google Drive. Para usar de novo, será preciso o código do cofre.')) return;
  await A.apagarTudo(); D.esquecer(); chave = null; estado = null; G = null; usuario = null;
  pilha = [['configurar', [1]]]; desenhar();
}
